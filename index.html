<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-title" content="Finanzas">

    <link rel="manifest" href='data:application/manifest+json,{"name":"Control Finanzas","short_name":"Finanzas","start_url":".","display":"standalone","background_color":"#f8fafc","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/10543/10543209.png","sizes":"512x512","type":"image/png"}]}'>

    <title>FINANZAS V19.0 (APP)</title>

    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/10543/10543209.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        /* ESTILOS APP */
        body { font-family: system-ui, -apple-system, sans-serif; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; user-select: none; touch-action: manipulation; }
        
        /* Tema Claro/Oscuro */
        body.light { background-color: #f8fafc; color: #1e293b; }
        body.dark { background-color: #0f172a; color: #e2e8f0; }

        /* Tarjetas */
        .card { background: white; border-radius: 1.25rem; padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 1rem; border: 1px solid #f1f5f9; }
        html.dark .card { background-color: #1e293b; border-color: #334155; }

        /* Inputs */
        input, select { border: 1px solid #e2e8f0 !important; border-radius: 0.75rem; height: 44px; padding: 0 12px; width: 100%; outline: none; font-size: 16px !important; background: white; color: #1e293b; }
        html.dark input, html.dark select { background-color: #334155; border-color: #475569 !important; color: white; }

        /* Navegación */
        .nav-btn { color: #94a3b8; transition: 0.2s; }
        .nav-btn.active { color: #3b82f6; transform: scale(1.1); }

        /* Tabs */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Botones Tipo */
        .btn-tipo { flex: 1; padding: 10px; border-radius: 0.75rem; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; background: #f1f5f9; color: #64748b; transition: 0.2s; }
        .btn-tipo.active { background: #1e293b; color: white; transform: scale(1.02); }
        
        /* Calculadora */
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { height: 55px; border-radius: 12px; font-size: 20px; font-weight: bold; background: #f1f5f9; color: #334155; display: flex; align-items: center; justify-content: center; active:scale:95; }
        html.dark .calc-btn { background: #334155; color: white; }

        /* Toast */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; opacity: 0; pointer-events: none; transition: 0.3s; }
        #toast-container.show { opacity: 1; top: 40px; }
    </style>
</head>
<body class="light">

    <div id="toast-container">
        <div class="bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3">
            <i class="fas fa-check-circle text-emerald-400"></i>
            <span id="toast-msg" class="font-bold text-sm">Acción realizada</span>
        </div>
    </div>

    <header class="fixed top-0 w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur z-50 px-5 py-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pt-[env(safe-area-inset-top)]">
        <div>
            <h1 class="text-2xl font-black italic tracking-tighter text-slate-800 dark:text-white">FINANZAS <span class="text-blue-500">V19</span></h1>
            <p id="fecha-header" class="text-xs text-slate-400 font-bold uppercase tracking-widest"></p>
        </div>
        <div class="flex gap-3">
             <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-yellow-400 flex items-center justify-center"><i id="theme-icon" class="fas fa-moon"></i></button>
        </div>
    </header>

    <div class="h-20"></div> <div id="tab-muro" class="tab-content active px-4 max-w-lg mx-auto">
        <div class="card bg-gradient-to-br from-slate-800 to-slate-900 text-white border-none relative overflow-hidden">
            <div class="relative z-10 text-center">
                <p class="text-slate-400 text-xs font-bold uppercase mb-1">Disponible Real</p>
                <h2 id="total-balance" class="text-4xl font-black tracking-tight mb-4">0.00 €</h2>
                <div class="flex justify-center gap-6 text-sm">
                    <div class="text-emerald-400"><i class="fas fa-arrow-up"></i> <span id="total-ingresos">0</span></div>
                    <div class="text-rose-400"><i class="fas fa-arrow-down"></i> <span id="total-gastos">0</span></div>
                </div>
            </div>
        </div>

        <div class="card border-l-4 border-blue-500">
            <div class="flex gap-2 mb-4">
                <button onclick="setTipo('Ingreso')" id="btn-ingreso" class="btn-tipo active">Ingreso</button>
                <button onclick="setTipo('Gasto')" id="btn-gasto" class="btn-tipo">Gasto</button>
            </div>

            <div class="flex gap-3 mb-3">
                <input type="date" id="fecha" class="font-bold text-sm">
                <div class="relative w-full">
                    <input type="text" id="valor" placeholder="0.00" readonly onclick="abrirCalc()" class="text-right font-black text-blue-600 tracking-wide text-lg cursor-pointer bg-blue-50/50">
                    <i class="fas fa-calculator absolute left-3 top-3.5 text-blue-300"></i>
                </div>
            </div>

            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <select id="categoria" onchange="actualizarConceptos()" class="text-xs font-bold uppercase text-slate-600"></select>
                    <select id="concepto" class="text-xs font-bold uppercase text-slate-600"><option>GENERAL</option></select>
                </div>
                <input type="text" id="nota" placeholder="Nota opcional..." class="text-sm">
                <button onclick="guardarMovimiento()" id="btn-save" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg mt-2 active:scale-95 transition-transform">Guardar Movimiento</button>
                <button onclick="cancelarEdicion()" id="btn-cancel" class="hidden w-full bg-slate-200 text-slate-500 py-3 rounded-xl font-bold text-xs uppercase mt-2">Cancelar</button>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4 px-2">
            <h3 class="font-black text-slate-400 text-xs uppercase">Últimos Movimientos</h3>
            <select id="filtro-mes" onchange="renderMovimientos()" class="!w-32 !h-8 !text-xs !py-0 bg-white dark:bg-slate-800 font-bold border-none"></select>
        </div>
        <div id="lista-movimientos" class="space-y-3 pb-24"></div>
    </div>

    <div id="tab-graficos" class="tab-content px-4 max-w-lg mx-auto pb-24">
        <div class="card">
            <h3 class="text-center font-black text-slate-500 text-xs uppercase mb-4">Gastos por Categoría</h3>
            <div class="h-64"><canvas id="grafico-cat"></canvas></div>
        </div>
        <div class="card">
            <h3 class="text-center font-black text-slate-500 text-xs uppercase mb-4">Evolución Anual</h3>
            <div class="h-48"><canvas id="grafico-evo"></canvas></div>
        </div>
    </div>

    <div id="tab-ajustes" class="tab-content px-4 max-w-lg mx-auto pb-24">
        
        <div class="card border-l-4 border-purple-500">
            <h3 class="font-black text-purple-600 text-xs uppercase mb-4">Añadir Categoría / Presupuesto</h3>
            <div class="grid grid-cols-2 gap-2 mb-2">
                <input type="text" id="new-cat" placeholder="NOMBRE CATEGORÍA" class="uppercase text-xs font-bold">
                <input type="number" id="new-presup" placeholder="PRESUPUESTO €" class="text-xs font-bold">
            </div>
            <button onclick="guardarCategoria()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold text-xs uppercase">Guardar Categoría</button>
        </div>
        <div id="lista-categorias" class="space-y-2 mt-4"></div>

        <div class="mt-8 pt-8 border-t border-slate-200 dark:border-slate-800">
            <h3 class="font-black text-slate-400 text-xs uppercase mb-4 text-center">Gestión de Datos</h3>
            
            <button onclick="exportarExcel()" class="w-full mb-3 bg-emerald-600 text-white py-4 rounded-xl font-black text-xs uppercase flex items-center justify-center gap-2 shadow-lg">
                <i class="fas fa-file-excel text-lg"></i> Exportar a Excel
            </button>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="backupJSON()" class="bg-slate-800 text-white py-3 rounded-xl font-bold text-xs uppercase">
                    <i class="fas fa-download"></i> Backup JSON
                </button>
                <label class="bg-slate-200 text-slate-600 py-3 rounded-xl font-bold text-xs uppercase text-center cursor-pointer">
                    <i class="fas fa-upload"></i> Restaurar
                    <input type="file" class="hidden" onchange="restaurarJSON(event)">
                </label>
            </div>
            <button onclick="borrarTodo()" class="w-full mt-6 text-rose-500 font-bold text-xs uppercase py-3">Borrar Todos los Datos</button>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex justify-around py-3 pb-[env(safe-area-inset-bottom)] z-50">
        <button onclick="nav('muro')" id="nav-muro" class="nav-btn active flex flex-col items-center gap-1">
            <i class="fas fa-home text-xl"></i><span class="text-[10px] font-black uppercase">Muro</span>
        </button>
        <button onclick="nav('graficos')" id="nav-graficos" class="nav-btn flex flex-col items-center gap-1">
            <i class="fas fa-chart-pie text-xl"></i><span class="text-[10px] font-black uppercase">Gráficos</span>
        </button>
        <button onclick="nav('ajustes')" id="nav-ajustes" class="nav-btn flex flex-col items-center gap-1">
            <i class="fas fa-cog text-xl"></i><span class="text-[10px] font-black uppercase">Ajustes</span>
        </button>
    </nav>

    <div id="modal-calc" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-end sm:items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
            <div class="bg-slate-100 dark:bg-slate-700 p-4 rounded-2xl mb-4 text-right">
                <span id="calc-display" class="text-3xl font-black text-slate-800 dark:text-white">0</span>
            </div>
            <div class="calc-grid">
                <button onclick="calc('C')" class="calc-btn text-rose-500">C</button>
                <button onclick="calc('/')" class="calc-btn text-blue-500">÷</button>
                <button onclick="calc('*')" class="calc-btn text-blue-500">×</button>
                <button onclick="calc('-')" class="calc-btn text-blue-500">-</button>
                <button onclick="calc('7')" class="calc-btn">7</button>
                <button onclick="calc('8')" class="calc-btn">8</button>
                <button onclick="calc('9')" class="calc-btn">9</button>
                <button onclick="calc('+')" class="calc-btn text-blue-500">+</button>
                <button onclick="calc('4')" class="calc-btn">4</button>
                <button onclick="calc('5')" class="calc-btn">5</button>
                <button onclick="calc('6')" class="calc-btn">6</button>
                <button onclick="calc('.')" class="calc-btn">.</button>
                <button onclick="calc('1')" class="calc-btn">1</button>
                <button onclick="calc('2')" class="calc-btn">2</button>
                <button onclick="calc('3')" class="calc-btn">3</button>
                <button onclick="calc('0')" class="calc-btn col-span-1">0</button>
                <button onclick="calcOk()" class="calc-btn bg-blue-600 text-white col-span-4 mt-2 shadow-lg">ACEPTAR</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN INICIAL
        const DB_KEY = 'FINANZAS_V19_0_DATA';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
            movs: [],
            cats: [ // Categorías por defecto
                { nombre: 'NOMINA', presupuesto: 0, tipo: 'Ingreso' },
                { nombre: 'ALIMENTACION', presupuesto: 300, tipo: 'Gasto' },
                { nombre: 'VIVIENDA', presupuesto: 500, tipo: 'Gasto' },
                { nombre: 'TRANSPORTE', presupuesto: 100, tipo: 'Gasto' },
                { nombre: 'OCIO', presupuesto: 150, tipo: 'Gasto' }
            ]
        };
        
        let tipoActual = 'Ingreso';
        let idEditando = null;
        let mesFiltro = new Date().toISOString().slice(0, 7);
        let calcVal = '';
        let charts = {};

        // INICIAR
        window.onload = () => {
            document.getElementById('fecha').valueAsDate = new Date();
            document.getElementById('fecha-header').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            actualizarSelectCategorias();
            renderMovimientos();
            renderCategorias();
        };

        // NAVEGACIÓN
        function nav(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-' + tab).classList.add('active');
            
            if (tab === 'graficos') renderGraficos();
        }

        function setTipo(t) {
            tipoActual = t;
            document.querySelectorAll('.btn-tipo').forEach(b => b.classList.remove('active'));
            document.getElementById(t === 'Ingreso' ? 'btn-ingreso' : 'btn-gasto').classList.add('active');
            actualizarSelectCategorias();
        }

        // LÓGICA DE DATOS
        function guardarMovimiento() {
            const valor = parseFloat(document.getElementById('valor').value);
            const cat = document.getElementById('categoria').value;
            
            if (!valor || !cat) return notificar('Faltan datos');

            const mov = {
                id: idEditando || Date.now(),
                fecha: document.getElementById('fecha').value,
                tipo: tipoActual,
                cat: cat,
                con: document.getElementById('concepto').value || 'GENERAL',
                nota: document.getElementById('nota').value,
                valor: valor
            };

            if (idEditando) {
                const index = db.movs.findIndex(m => m.id === idEditando);
                db.movs[index] = mov;
                notificar('Movimiento Actualizado');
                idEditando = null;
                document.getElementById('btn-save').innerText = 'GUARDAR MOVIMIENTO';
                document.getElementById('btn-cancel').classList.add('hidden');
            } else {
                db.movs.push(mov);
                notificar('Movimiento Guardado');
            }

            // Limpiar
            document.getElementById('valor').value = '';
            document.getElementById('nota').value = '';
            
            save();
            renderMovimientos();
        }

        function editar(id) {
            const m = db.movs.find(x => x.id === id);
            if (!m) return;
            
            idEditando = id;
            document.getElementById('fecha').value = m.fecha;
            document.getElementById('valor').value = m.valor;
            document.getElementById('nota').value = m.nota;
            setTipo(m.tipo);
            document.getElementById('categoria').value = m.cat;
            
            document.getElementById('btn-save').innerText = 'ACTUALIZAR MOVIMIENTO';
            document.getElementById('btn-cancel').classList.remove('hidden');
            document.getElementById('tab-muro').scrollIntoView();
        }

        function cancelarEdicion() {
            idEditando = null;
            document.getElementById('valor').value = '';
            document.getElementById('nota').value = '';
            document.getElementById('btn-save').innerText = 'GUARDAR MOVIMIENTO';
            document.getElementById('btn-cancel').classList.add('hidden');
        }

        function borrar(id) {
            if(confirm('¿Eliminar registro?')) {
                db.movs = db.movs.filter(m => m.id !== id);
                save();
                renderMovimientos();
            }
        }

        function renderMovimientos() {
            // Actualizar Filtro Meses
            const meses = [...new Set(db.movs.map(m => m.fecha.slice(0, 7)))].sort().reverse();
            const hoy = new Date().toISOString().slice(0, 7);
            if (!meses.includes(hoy)) meses.unshift(hoy);
            
            const selectMes = document.getElementById('filtro-mes');
            if (selectMes.innerHTML === '') { // Solo llenar si está vacío para no perder selección
                selectMes.innerHTML = meses.map(m => `<option value="${m}">${m}</option>`).join('');
                selectMes.value = hoy;
                mesFiltro = hoy;
            } else {
                mesFiltro = selectMes.value;
            }

            // Filtrar y Calcular
            const filtrados = db.movs.filter(m => m.fecha.startsWith(mesFiltro));
            const totalIng = filtrados.filter(m => m.tipo === 'Ingreso').reduce((a, b) => a + b.valor, 0);
            const totalGas = filtrados.filter(m => m.tipo === 'Gasto').reduce((a, b) => a + b.valor, 0);

            document.getElementById('total-ingresos').innerText = totalIng.toFixed(2) + '€';
            document.getElementById('total-gastos').innerText = totalGas.toFixed(2) + '€';
            document.getElementById('total-balance').innerText = (totalIng - totalGas).toFixed(2) + '€';

            // Pintar Lista
            const lista = document.getElementById('lista-movimientos');
            lista.innerHTML = filtrados.sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).map(m => `
                <div class="card p-4 flex justify-between items-center border-l-4 ${m.tipo === 'Ingreso' ? 'border-emerald-500' : 'border-rose-500'}">
                    <div onclick="editar(${m.id})" class="flex-1 cursor-pointer">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] font-black bg-slate-100 text-slate-500 px-2 py-0.5 rounded uppercase">${m.cat}</span>
                            <span class="text-[10px] text-slate-300 font-bold">${m.fecha.split('-')[2]}</span>
                        </div>
                        <p class="font-bold text-sm text-slate-700 dark:text-slate-200 uppercase">${m.nota || m.con}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-lg ${m.tipo === 'Ingreso' ? 'text-emerald-600' : 'text-rose-600'}">${m.valor.toFixed(2)}€</p>
                        <button onclick="borrar(${m.id})" class="text-slate-300 hover:text-rose-500 text-sm mt-1"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-300 italic mt-10">Sin movimientos este mes</p>';
        }

        // GESTIÓN CATEGORÍAS
        function guardarCategoria() {
            const nombre = document.getElementById('new-cat').value.toUpperCase();
            const presup = parseFloat(document.getElementById('new-presup').value);
            if (!nombre) return;

            db.cats.push({ nombre, presupuesto: presup || 0, tipo: 'Gasto' }); // Por defecto Gasto
            save();
            actualizarSelectCategorias();
            renderCategorias();
            document.getElementById('new-cat').value = '';
        }

        function renderCategorias() {
            document.getElementById('lista-categorias').innerHTML = db.cats.map((c, i) => `
                <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                    <div>
                        <p class="font-bold text-xs uppercase">${c.nombre}</p>
                        <p class="text-[10px] text-slate-400">Presupuesto: ${c.presupuesto}€</p>
                    </div>
                    <button onclick="eliminarCat(${i})" class="text-rose-300"><i class="fas fa-times"></i></button>
                </div>
            `).join('');
        }

        function eliminarCat(index) {
            if(confirm('¿Borrar categoría?')) {
                db.cats.splice(index, 1);
                save();
                actualizarSelectCategorias();
                renderCategorias();
            }
        }

        function actualizarSelectCategorias() {
            const cats = db.cats.map(c => c.nombre).sort(); // Mostrar todas o filtrar por tipo si quieres
            document.getElementById('categoria').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
            actualizarConceptos();
        }
        
        function actualizarConceptos() {
            // Simplificado para v19.0: Concepto fijo o basado en historial podría ir aquí
            document.getElementById('concepto').innerHTML = '<option>GENERAL</option>';
        }

        // EXPORTACIÓN EXCEL (CSV)
        function exportarExcel() {
            if (db.movs.length === 0) return notificar("No hay datos para exportar");

            // 1. Crear cabecera (BOM para acentos + delimitador ;)
            let csvContent = "\uFEFFFecha;Tipo;Categoría;Concepto;Importe;Nota\n";

            // 2. Recorrer datos
            db.movs.forEach(m => {
                // Reemplazar punto por coma para Excel español
                let importeStr = m.valor.toFixed(2).replace('.', ',');
                let notaLimpia = (m.nota || "").replace(/;/g, " "); // Evitar romper CSV
                
                let fila = `${m.fecha};${m.tipo};${m.cat};${m.con};${importeStr};${notaLimpia}`;
                csvContent += fila + "\n";
            });

            // 3. Crear descarga
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Finanzas_Excel_${new Date().toISOString().slice(0,10)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            notificar("Excel descargado");
        }

        // BACKUP Y RESTORE
        function save() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
        function backupJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "backup_finanzas_v19.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
        function restaurarJSON(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                db = JSON.parse(e.target.result);
                save();
                location.reload();
            };
            reader.readAsText(event.target.files[0]);
        }
        function borrarTodo() {
            if(confirm('ATENCIÓN: Se borrarán todos los datos. ¿Estás seguro?')) {
                localStorage.removeItem(DB_KEY);
                location.reload();
            }
        }

        // GRÁFICOS
        function renderGraficos() {
            const ctxCat = document.getElementById('grafico-cat');
            const movsMes = db.movs.filter(m => m.fecha.startsWith(mesFiltro) && m.tipo === 'Gasto');
            
            // Agrupar
            const datos = {};
            movsMes.forEach(m => { datos[m.cat] = (datos[m.cat] || 0) + m.valor; });
            
            if (charts.cat) charts.cat.destroy();
            charts.cat = new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(datos),
                    datasets: [{ data: Object.values(datos), backgroundColor: ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6'] }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });

            // Evolución (Ultimos 6 meses)
            const ctxEvo = document.getElementById('grafico-evo');
            const mesesLabels = [];
            const dataEvo = [];
            for (let i=5; i>=0; i--) {
                const d = new Date();
                d.setMonth(d.getMonth() - i);
                const k = d.toISOString().slice(0,7);
                mesesLabels.push(k);
                const sum = db.movs.filter(m => m.fecha.startsWith(k) && m.tipo === 'Gasto').reduce((a,b)=>a+b.valor,0);
                dataEvo.push(sum);
            }

            if (charts.evo) charts.evo.destroy();
            charts.evo = new Chart(ctxEvo, {
                type: 'bar',
                data: {
                    labels: mesesLabels,
                    datasets: [{ label: 'Gastos', data: dataEvo, backgroundColor: '#cbd5e1', borderRadius: 5 }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });
        }

        // UTILIDADES Y CALCULADORA
        function notificar(msg) {
            const t = document.getElementById('toast-container');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        function toggleTheme() {
            document.body.classList.toggle('dark');
            document.body.classList.toggle('light');
        }
        function abrirCalc() { document.getElementById('modal-calc').classList.remove('hidden'); calcVal = ''; document.getElementById('calc-display').innerText = '0'; }
        function calc(v) { 
            if(v === 'C') calcVal = ''; 
            else calcVal += v; 
            document.getElementById('calc-display').innerText = calcVal || '0'; 
        }
        function calcOk() {
            try {
                const res = eval(calcVal);
                document.getElementById('valor').value = parseFloat(res).toFixed(2);
                document.getElementById('modal-calc').classList.add('hidden');
            } catch (e) { alert('Error en cálculo'); }
        }
    </script>
