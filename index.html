<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Mis Finanzas v17.4","short_name":"Finanzas","start_url":"./","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2489/2489756.png","sizes":"512x512","type":"image/png"}]}'>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">

    <title>FINANZAS V17.4 PRO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                        accentBlue: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .safe-pt { padding-top: env(safe-area-inset-top); }
        
        .card-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        input, select {
            @apply transition-all duration-200;
            font-size: 16px !important; /* Evita zoom en iOS */
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.3s ease-out; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-btn.active { @apply text-blue-500 scale-110 font-bold; }

        /* Estilos personalizados para scroll */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg transition-colors duration-300 min-h-screen">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));`;
                const blob = new Blob([swCode], {type: 'text/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(blob));
            });
        }
    </script>

    <header class="bg-darkBg text-white safe-pt sticky top-0 z-50 shadow-2xl">
        <div class="px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-chart-pie text-sm"></i>
                </div>
                <h1 class="font-black italic text-xl tracking-tighter uppercase">Finanzas <span class="text-blue-500">v17.4</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="text-yellow-400 hover:scale-110 transition">
                    <i class="fas fa-moon text-xl"></i>
                </button>
                <div class="relative">
                    <select id="filtro-mes" onchange="cambiarMes(this.value)" 
                            class="bg-slate-800 text-white text-[10px] font-black py-1 px-3 rounded-full border-none appearance-none pr-6 cursor-pointer">
                    </select>
                    <i class="fas fa-chevron-down absolute right-2 top-1/2 -translate-y-1/2 text-[8px] pointer-events-none"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-32">
        
        <div id="muro" class="tab-content active">
            
            <div class="card-gradient rounded-[2rem] p-8 text-white mb-6 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 p-8 opacity-10">
                    <i class="fas fa-wallet text-7xl"></i>
                </div>
                <div class="relative z-10">
                    <p class="text-slate-400 text-[10px] uppercase font-black tracking-[0.2em] mb-2">Disponible Total</p>
                    <h2 id="disp-real" class="text-5xl font-black tracking-tighter mb-8">0.00€</h2>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white/5 backdrop-blur-md rounded-2xl p-4 border border-white/10">
                            <p class="text-emerald-400 text-[9px] font-black uppercase mb-1">Ingresos</p>
                            <p id="total-ing" class="text-xl font-bold">0€</p>
                        </div>
                        <div class="bg-white/5 backdrop-blur-md rounded-2xl p-4 border border-white/10">
                            <p class="text-rose-400 text-[9px] font-black uppercase mb-1">Gastos</p>
                            <p id="total-gas" class="text-xl font-bold">0€</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white dark:bg-darkCard rounded-[2rem] p-6 shadow-xl mb-8 border border-slate-100 dark:border-slate-800">
                <div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-2xl mb-6">
                    <button onclick="setTipo('Gasto')" id="btn-gas" 
                            class="flex-1 py-3 rounded-xl text-xs font-black uppercase transition-all duration-300 bg-white dark:bg-blue-600 shadow-md text-blue-600 dark:text-white">
                        <i class="fas fa-minus-circle mr-1"></i> Gasto
                    </button>
                    <button onclick="setTipo('Ingreso')" id="btn-ing" 
                            class="flex-1 py-3 rounded-xl text-xs font-black uppercase transition-all duration-300 text-slate-500">
                        <i class="fas fa-plus-circle mr-1"></i> Ingreso
                    </button>
                </div>

                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Fecha</label>
                            <input type="date" id="in-fecha" class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-xl p-3 font-bold text-sm dark:text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Importe</label>
                            <input type="number" id="in-valor" placeholder="0.00" step="0.01" 
                                   class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-xl p-3 font-black text-lg text-blue-600 dark:text-blue-400 text-right">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Categoría</label>
                            <select id="in-cat" class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-xl p-3 font-bold text-sm dark:text-white appearance-none"></select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Nota</label>
                            <input type="text" id="in-nota" placeholder="Concepto..." 
                                   class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-xl p-3 font-medium text-sm dark:text-white">
                        </div>
                    </div>

                    <button onclick="guardarRegistro()" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest transition-all shadow-lg shadow-blue-500/30 active:scale-95">
                        Guardar Movimiento
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-center mb-4 px-2">
                <h3 class="font-black text-slate-400 text-[10px] uppercase tracking-widest">Movimientos Recientes</h3>
                <span id="contador-movs" class="bg-blue-100 text-blue-600 text-[10px] font-black px-2 py-1 rounded-md">0</span>
            </div>

            <div id="lista-movs" class="space-y-3"></div>
        </div>

        <div id="stats" class="tab-content">
            <div class="bg-white dark:bg-darkCard rounded-[2rem] p-6 shadow-xl border border-slate-100 dark:border-slate-800">
                <h3 class="font-black text-slate-800 dark:text-white text-sm mb-6 flex items-center gap-2">
                    <i class="fas fa-chart-pie text-blue-500"></i> Distribución de Gastos
                </h3>
                <div class="h-72 w-full relative">
                    <canvas id="chartGastos"></canvas>
                </div>
                <div id="leyenda-custom" class="mt-8 grid grid-cols-2 gap-2"></div>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-darkCard border-t border-slate-100 dark:border-slate-800 px-6 py-4 flex justify-around items-center z-50">
        <button onclick="showTab('muro')" id="nav-muro" class="nav-btn active flex flex-col items-center gap-1 transition-all">
            <i class="fas fa-layer-group text-xl"></i>
            <span class="text-[9px] font-black uppercase">Muro</span>
        </button>
        <button onclick="showTab('stats')" id="nav-stats" class="nav-btn text-slate-400 flex flex-col items-center gap-1 transition-all">
            <i class="fas fa-chart-bar text-xl"></i>
            <span class="text-[9px] font-black uppercase">Stats</span>
        </button>
        <button onclick="exportarExcel()" class="text-slate-400 flex flex-col items-center gap-1 hover:text-emerald-500 transition-all">
            <i class="fas fa-file-excel text-xl"></i>
            <span class="text-[9px] font-black uppercase">Exportar</span>
        </button>
        <button onclick="borrarTodo()" class="text-slate-400 flex flex-col items-center gap-1 hover:text-rose-500 transition-all">
            <i class="fas fa-trash-alt text-xl"></i>
            <span class="text-[9px] font-black uppercase">Reset</span>
        </button>
    </nav>

    <script>
        // --- BASE DE DATOS Y ESTADO ---
        const DB_KEY = 'FINANZAS_V17_4_MASTER';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
            movs: [],
            cats: {
                Gasto: ['Vivienda', 'Alimentación', 'Ocio', 'Salud', 'Transporte', 'Suscripciones', 'Varios'],
                Ingreso: ['Nómina', 'Transferencia', 'Efectivo', 'Regalo', 'Otros']
            },
            theme: 'light'
        };

        let tipoActual = 'Gasto';
        let mesSeleccionado = new Date().toISOString().slice(0, 7);
        let myChart = null;

        function save() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        // --- GESTIÓN DE PESTAÑAS ---
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'text-blue-500', 'scale-110', 'font-bold'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.add('text-slate-400'));

            document.getElementById(tabId).classList.add('active');
            const activeBtn = document.getElementById('nav-' + tabId);
            activeBtn.classList.add('active');
            activeBtn.classList.remove('text-slate-400');

            if (tabId === 'stats') renderChart();
        }

        // --- LÓGICA DE REGISTRO ---
        function setTipo(tipo) {
            tipoActual = tipo;
            const btnG = document.getElementById('btn-gas');
            const btnI = document.getElementById('btn-ing');

            if (tipo === 'Gasto') {
                btnG.classList.add('bg-white', 'dark:bg-blue-600', 'shadow-md', 'text-blue-600', 'dark:text-white');
                btnG.classList.remove('text-slate-500');
                btnI.classList.remove('bg-white', 'dark:bg-blue-600', 'shadow-md', 'text-blue-600', 'dark:text-white');
                btnI.classList.add('text-slate-500');
            } else {
                btnI.classList.add('bg-white', 'dark:bg-blue-600', 'shadow-md', 'text-blue-600', 'dark:text-white');
                btnI.classList.remove('text-slate-500');
                btnG.classList.remove('bg-white', 'dark:bg-blue-600', 'shadow-md', 'text-blue-600', 'dark:text-white');
                btnG.classList.add('text-slate-500');
            }
            renderCats();
        }

        function renderCats() {
            const select = document.getElementById('in-cat');
            select.innerHTML = db.cats[tipoActual].map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function guardarRegistro() {
            const val = parseFloat(document.getElementById('in-valor').value);
            const fec = document.getElementById('in-fecha').value;
            const cat = document.getElementById('in-cat').value;
            const nota = document.getElementById('in-nota').value.trim();

            if (!val || !fec) {
                alert("Completa el importe y la fecha");
                return;
            }

            db.movs.push({
                id: Date.now(),
                fecha: fec,
                valor: val,
                tipo: tipoActual,
                cat: cat,
                nota: nota.toUpperCase()
            });

            save();
            actualizarUI();
            
            // Reset campos
            document.getElementById('in-valor').value = "";
            document.getElementById('in-nota').value = "";
            
            // Vibración hípica si está disponible
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        }

        function eliminarMovimiento(id) {
            if (confirm("¿Eliminar este registro?")) {
                db.movs = db.movs.filter(m => m.id !== id);
                save();
                actualizarUI();
                if (document.getElementById('stats').classList.contains('active')) renderChart();
            }
        }

        // --- ACTUALIZACIÓN DE INTERFAZ ---
        function actualizarUI() {
            // Actualizar Selector de Meses
            const mesesDisponibles = [...new Set(db.movs.map(m => m.fecha.slice(0, 7)))].sort().reverse();
            if (!mesesDisponibles.includes(mesSeleccionado)) mesesDisponibles.unshift(mesSeleccionado);
            
            const selMes = document.getElementById('filtro-mes');
            selMes.innerHTML = mesesDisponibles.map(m => {
                const [y, mm] = m.split('-');
                const fechaLabel = new Date(y, mm - 1).toLocaleString('es', { month: 'short', year: 'numeric' });
                return `<option value="${m}" ${m === mesSeleccionado ? 'selected' : ''}>${fechaLabel.toUpperCase()}</option>`;
            }).join('');

            // Filtrar datos
            const movsMes = db.movs.filter(m => m.fecha.startsWith(mesSeleccionado)).sort((a,b) => b.id - a.id);
            
            let totalI = 0, totalG = 0;
            const lista = document.getElementById('lista-movs');
            lista.innerHTML = "";

            movsMes.forEach(m => {
                if (m.tipo === 'Ingreso') totalI += m.valor; else totalG += m.valor;

                const card = document.createElement('div');
                card.className = "bg-white dark:bg-darkCard p-5 rounded-[1.5rem] flex justify-between items-center shadow-sm border border-slate-50 dark:border-slate-800/50";
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center ${m.tipo === 'Ingreso' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                            <i class="fas ${m.tipo === 'Ingreso' ? 'fa-arrow-down' : 'fa-arrow-up'} text-xs"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">${m.fecha.split('-').reverse().join('/')}</span>
                                <span class="text-[8px] font-black px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 uppercase">${m.cat}</span>
                            </div>
                            <p class="text-xs font-bold text-slate-700 dark:text-slate-200">${m.nota || m.cat}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-black text-sm ${m.tipo === 'Ingreso' ? 'text-emerald-500' : 'text-rose-500'}">
                            ${m.tipo === 'Ingreso' ? '+' : '-'}${m.valor.toFixed(2)}€
                        </span>
                        <button onclick="eliminarMovimiento(${m.id})" class="text-slate-300 hover:text-rose-500 transition-colors">
                            <i class="fas fa-times-circle"></i>
                        </button>
                    </div>
                `;
                lista.appendChild(card);
            });

            // Actualizar Totales
            document.getElementById('disp-real').innerText = (totalI - totalG).toFixed(2) + "€";
            document.getElementById('total-ing').innerText = totalI.toFixed(0) + "€";
            document.getElementById('total-gas').innerText = totalG.toFixed(0) + "€";
            document.getElementById('contador-movs').innerText = movsMes.length;
        }

        function cambiarMes(m) {
            mesSeleccionado = m;
            actualizarUI();
            if (document.getElementById('stats').classList.contains('active')) renderChart();
        }

        // --- GRÁFICOS ---
        function renderChart() {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            const movsGastos = db.movs.filter(m => m.fecha.startsWith(mesSeleccionado) && m.tipo === 'Gasto');
            
            const resumen = {};
            movsGastos.forEach(m => resumen[m.cat] = (resumen[m.cat] || 0) + m.valor);

            const labels = Object.keys(resumen);
            const data = Object.values(resumen);

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899'],
                        borderWidth: 0,
                        hoverOffset: 20
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // Leyenda personalizada
            const leyenda = document.getElementById('leyenda-custom');
            leyenda.innerHTML = labels.map((l, i) => `
                <div class="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-800/50 rounded-lg">
                    <div class="w-2 h-2 rounded-full" style="background: ${myChart.data.datasets[0].backgroundColor[i]}"></div>
                    <div class="flex-1">
                        <p class="text-[9px] font-black text-slate-400 uppercase">${l}</p>
                        <p class="text-[10px] font-bold dark:text-white">${resumen[l].toFixed(2)}€</p>
                    </div>
                </div>
            `).join('');
        }

        // --- EXPORTACIÓN Y TEMA ---
        function exportarExcel() {
            const data = db.movs.map(m => ({
                FECHA: m.fecha,
                TIPO: m.tipo,
                CATEGORIA: m.cat,
                NOTA: m.nota,
                IMPORTE: m.valor
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Finanzas");
            XLSX.writeFile(wb, `Finanzas_${mesSeleccionado}.xlsx`);
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            db.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            save();
        }

        function borrarTodo() {
            if (confirm("¡PELIGRO! Se borrarán todos tus datos permanentemente.")) {
                db.movs = [];
                save();
                actualizarUI();
            }
        }

        // --- INICIO ---
        window.onload = () => {
            if (db.theme === 'dark') document.documentElement.classList.add('dark');
            document.getElementById('in-fecha').valueAsDate = new Date();
            renderCats();
            actualizarUI();
        };
    </script>
</body>
</html>
