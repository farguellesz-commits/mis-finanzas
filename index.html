        @keyframes sweep { 0% {opacity: 0; transform: translateY(-10px)} 100% {opacity: 1; transform: translateY(0)} }

                {id: 17708983937, fecha: "2026-02-03", tipo: "Gasto", cat: "SALUD", nota: "SEGURO MÉDICO", valor: 115.94},
                {id: 17708984097, fecha: "2026-02-03", tipo: "Gasto", cat: "FUENTIDUEÑA", nota: "SEGURO MAPFRE", valor: 53.03},
                {id: 17708984289, fecha: "2026-02-03", tipo: "Gasto", cat: "PISO CHILE", nota: "SEGURO MAPFRE", valor: 21.31},
                {id: 17708984469, fecha: "2026-02-03", tipo: "Gasto", cat: "PISO P. SÁNC", nota: "SEGURO MAPFRE", valor: 11.38},
                {id: 17708984616, fecha: "2026-02-03", tipo: "Gasto", cat: "COCHE", nota: "SEGURO MAPFRE", valor: 53.72},
                {id: 17708986359, fecha: "2026-02-11", tipo: "Gasto", cat: "FUENTIDUEÑA", nota: "REPSOL ELECTRICIDAD", valor: 97.90},
                {id: 17709000185, fecha: "2026-02-25", tipo: "Ingreso", cat: "PENSION", nota: "FERNANDO", valor: 2534.14},
                {id: 17709746184, fecha: "2026-02-13", tipo: "Gasto", cat: "VIDA DIARIA", nota: "ALIMENTACIÓN", valor: 100.00}
            ],
            presupuestos: {} 
        };

        const DB_NAME = 'FINANZAS_V17_RECOVERED';
        let db = JSON.parse(localStorage.getItem(DB_NAME)) || { movs: [], cats: DATOS_EXCEL.cats, presupuestos: {} };
        
        let tipoActual = 'Gasto';
        let idEditando = null;
        let mesAct = "2026-01"; 
        let myCharts = {};

        // VARIABLES CALCULADORA
        let calcVal = "0";
        let calcOpPend = null;
        let calcPrevVal = 0;
        let nuevoNum = true;

        window.onload = () => {
            document.getElementById('in-fecha').valueAsDate = new Date();
            document.getElementById('header-date').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            if(db.movs.length === 0) { db = DATOS_EXCEL; save(); }
            actualizarCats();
            render();
            renderPresupuestos();
        };

        // --- LÓGICA CALCULADORA ---
        function abrirCalc() { document.getElementById('calc-modal').style.display = 'flex'; calcClear(); }
        function cerrarCalc() { document.getElementById('calc-modal').style.display = 'none'; }
        
        function calcInput(n) {
            if (nuevoNum) { calcVal = n; nuevoNum = false; }
            else { calcVal = calcVal === "0" ? n : calcVal + n; }
            document.getElementById('calc-display').innerText = calcVal;
        }

        function calcOp(op) {
            const val = parseFloat(calcVal);
            if (calcOpPend && !nuevoNum) {
                switch(calcOpPend) {
                    case '+': calcPrevVal += val; break;
                    case '-': calcPrevVal -= val; break;
                    case '*': calcPrevVal *= val; break;
                    case '/': calcPrevVal /= val; break;
                }
                calcVal = String(calcPrevVal);
            } else {
                calcPrevVal = val;
            }
            nuevoNum = true;
            calcOpPend = op;
            document.getElementById('calc-display').innerText = calcVal;
        }

        function calcClear() {
            calcVal = "0"; calcOpPend = null; calcPrevVal = 0; nuevoNum = true;
            document.getElementById('calc-display').innerText = "0";
        }

        function calcOk() {
            if(calcOpPend) calcOp('='); // Resolver última operación si queda pendiente
            document.getElementById('in-valor').value = parseFloat(calcVal).toFixed(2);
            cerrarCalc();
        }

        // --- SISTEMA DE PRESUPUESTOS (NUEVO) ---
        function renderPresupuestos() {
            const list = document.getElementById('lista-presupuestos');
            list.innerHTML = "";
            
            db.cats.sort().forEach(cat => {
                const gastado = db.movs
                    .filter(m => m.cat === cat && m.tipo === 'Gasto' && m.fecha.startsWith(mesAct))
                    .reduce((sum, m) => sum + m.valor, 0);
                
                const presu = db.presupuestos && db.presupuestos[cat] ? db.presupuestos[cat] : 0;
                const disponible = presu - gastado;
                
                // Color disponible: Verde si > 0, Rojo si < 0
                const colorDisp = disponible >= 0 ? 'text-emerald-600' : 'text-rose-600';
                
                // Movimientos detallados de esta categoría
                const movsCat = db.movs
                    .filter(m => m.cat === cat && m.tipo === 'Gasto' && m.fecha.startsWith(mesAct))
                    .sort((a,b) => new Date(b.fecha) - new Date(a.fecha))
                    .map(m => `<div class="flex justify-between text-[10px] text-slate-500 py-1 border-b border-slate-100">
                        <span>${m.fecha.split('-')[2]} - ${m.nota || 'S/N'}</span>
                        <span class="font-bold">${m.valor.toFixed(2)}€</span>
                    </div>`).join('');

                const html = `
                <div class="bg-slate-50 rounded-xl p-3 mb-2 border border-slate-200">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-xs uppercase text-slate-700">${cat}</span>
                        <input type="number" value="${presu}" placeholder="Meta..." 
                            onchange="setPresupuesto('${cat}', this.value)" 
                            class="w-20 h-8 text-right text-xs bg-white border rounded px-1">
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-500 uppercase font-bold mb-2">
                        <div>Gastado: <span class="text-rose-500">${gastado.toFixed(0)}€</span></div>
                        <div>Disponible: <span class="${colorDisp} text-sm">${disponible.toFixed(0)}€</span></div>
                    </div>
                    
                    <details>
                        <summary class="text-[10px] text-blue-500 font-bold uppercase text-center bg-blue-50 py-1 rounded cursor-pointer">
                            Ver Movimientos <i class="fas fa-chevron-down ml-1"></i>
                        </summary>
                        <div class="mt-2 pl-2 border-l-2 border-blue-200">
                            ${movsCat || '<p class="text-[9px] italic">Sin gastos este mes</p>'}
                        </div>
                    </details>
                </div>`;
                list.innerHTML += html;
            });
        }

        function setPresupuesto(cat, val) {
            if(!db.presupuestos) db.presupuestos = {};
            db.presupuestos[cat] = parseFloat(val);
            save();
            renderPresupuestos(); // Re-renderizar para actualizar cálculo
        }


        // --- FUNCIONES CORE ---
        function forzarCargaExcel() {
            if(confirm("¿Restaurar datos originales?")) { db = DATOS_EXCEL; save(); location.reload(); }
        }

        function ir(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+tab).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('n-'+tab).classList.add('active');
            if(tab === 'graficos') renderGraficos();
            if(tab === 'ajustes') renderPresupuestos();
        }

        function setTipo(t) {
            tipoActual = t;
            document.getElementById('t-ing').className = t === 'Ingreso' ? 'btn-tipo active' : 'btn-tipo';
            document.getElementById('t-gas').className = t === 'Gasto' ? 'btn-tipo active' : 'btn-tipo';
        }

        function guardar() {
            const val = parseFloat(document.getElementById('in-valor').value);
            const cat = document.getElementById('in-cat').value;
            const nota = document.getElementById('in-nota').value.toUpperCase();
            if(!val || !cat) return alert("Indica valor y categoría");

            const mov = { id: idEditando || Date.now(), fecha: document.getElementById('in-fecha').value, tipo: tipoActual, cat, nota, valor: val };

            if(idEditando) {
                const i = db.movs.findIndex(m => m.id === idEditando);
                db.movs[i] = mov;
                idEditando = null;
                document.getElementById('btn-main').innerText = "Guardar Movimiento";
                document.getElementById('btn-cancel').classList.add('hidden');
            } else {
                db.movs.push(mov);
            }

            save();
            document.getElementById('in-valor').value = "";
            document.getElementById('in-nota').value = "";
            render();
            renderPresupuestos(); // Actualizar presupuesto al guardar
        }

        function render() {
            const meses = [...new Set(db.movs.map(m => m.fecha.slice(0,7)))].sort().reverse();
            const mesReal = new Date().toISOString().slice(0,7);
            if(!meses.includes(mesReal)) meses.unshift(mesReal);
            
            const comboMes = document.getElementById('filtro-mes');
            if(!mesAct) mesAct = meses[0];
            
            // Reconstruir combo preservando selección
            const selPrev = comboMes.value || mesAct;
            comboMes.innerHTML = meses.map(m => `<option value="${m}">${m}</option>`).join('');
            
            // Validar que la selección previa exista en la nueva lista
            if(meses.includes(selPrev)) {
                comboMes.value = selPrev;
                mesAct = selPrev;
            } else {
                comboMes.value = meses[0];
                mesAct = meses[0];
            }

            const filtrados = db.movs.filter(m => m.fecha.startsWith(mesAct));
            let ing = 0, gas = 0;

            document.getElementById('lista-movs').innerHTML = filtrados.sort((a,b) => new Date(b.fecha)-new Date(a.fecha)).map(m => {
                if(m.tipo === 'Ingreso') ing += m.valor; else gas += m.valor;
                return `
                <div class="card p-4 flex justify-between items-center border-l-4 ${m.tipo==='Ingreso'?'border-emerald-500':'border-rose-500'}">
                    <div onclick="prepararEdicion(${m.id})" class="flex-1 cursor-pointer">
                        <p class="text-[9px] font-black text-slate-400 uppercase">${m.cat} • ${m.fecha.split('-')[2]}</p>
                        <p class="font-bold text-sm text-slate-700">${m.nota || 'SIN NOTA'}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-lg ${m.tipo==='Ingreso'?'text-emerald-600':'text-rose-600'}">${m.valor.toFixed(2)}€</p>
                        <button onclick="borrar(${m.id})" class="text-slate-300 text-xs hover:text-rose-500"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            }).join('') || '<div class="text-center py-10 opacity-30 font-bold uppercase text-xs">No hay movimientos este mes</div>';

            document.getElementById('saldo-total').innerText = (ing - gas).toFixed(2) + "€";
            document.getElementById('total-ing').innerText = ing.toFixed(0) + "€";
            document.getElementById('total-gas').innerText = gas.toFixed(0) + "€";
        }

        function actualizarCats() {
            const sel = document.getElementById('in-cat');
            sel.innerHTML = db.cats.sort().map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('lista-cats').innerHTML = db.cats.map((c, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg text-[10px] font-bold">
                    ${c} <button onclick="delCat(${i})" class="text-rose-400"><i class="fas fa-times"></i></button>
                </div>
            `).join('');
        }
        function addCat() {
            const val = document.getElementById('new-cat').value.toUpperCase().trim();
            if(val) { db.cats.push(val); save(); actualizarCats(); renderPresupuestos(); document.getElementById('new-cat').value = ""; }
        }
        function delCat(i) { db.cats.splice(i, 1); save(); actualizarCats(); renderPresupuestos(); }

        function exportar() {
            const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `FINANZAS_BACKUP_${mesAct}.json`;
            a.click();
        }

        function save() { localStorage.setItem(DB_NAME, JSON.stringify(db)); }
        function cambiarMes(v) { mesAct = v; render(); renderPresupuestos(); }
        function borrar(id) { if(confirm("¿Eliminar?")) { db.movs = db.movs.filter(m => m.id !== id); save(); render(); renderPresupuestos(); } }
        function borrarTodo() { if(confirm("¡BORRAR TODO!")) { localStorage.clear(); location.reload(); } }
        
        function prepararEdicion(id) {
            const m = db.movs.find(x => x.id === id);
            idEditando = id;
            document.getElementById('in-fecha').value = m.fecha;
            document.getElementById('in-valor').value = m.valor;
            document.getElementById('in-nota').value = m.nota;
            document.getElementById('in-cat').value = m.cat;
            setTipo(m.tipo);
            document.getElementById('btn-main').innerText = "Actualizar Movimiento";
            document.getElementById('btn-cancel').classList.remove('hidden');
            window.scrollTo(0,0);
        }
        function cancelarEdicion() {
            idEditando = null;
            document.getElementById('btn-main').innerText = "Guardar Movimiento";
            document.getElementById('btn-cancel').classList.add('hidden');
            document.getElementById('in-valor').value = "";
            document.getElementById('in-nota').value = "";
        }

        function renderGraficos() {
            const filtrados = db.movs.filter(m => m.fecha.startsWith(mesAct) && m.tipo === 'Gasto');
            const totales = {};
            filtrados.forEach(m => totales[m.cat] = (totales[m.cat] || 0) + m.valor);

            if(myCharts.pie) myCharts.pie.destroy();
            myCharts.pie = new Chart(document.getElementById('chart-pie'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(totales),
                    datasets: [{ data: Object.values(totales), backgroundColor: ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4', '#ec4899'] }]
                }
            });

            const mesesDisponibles = [...new Set(db.movs.map(m => m.fecha.slice(0,7)))].sort();
            const mesesGrafico = mesesDisponibles.slice(-6);
            
            const dataBar = mesesGrafico.map(mes => {
                 return db.movs.filter(x => x.fecha.startsWith(mes) && x.tipo === 'Gasto').reduce((a,b)=>a+b.valor,0);
            });

            if(myCharts.bar) myCharts.bar.destroy();
            myCharts.bar = new Chart(document.getElementById('chart-bar'), {
                type: 'bar',
                data: {
                    labels: mesesGrafico,
                    datasets: [{ label: 'Gasto Mensual', data: dataBar, backgroundColor: '#3b82f6', borderRadius: 8 }]
                },
                options: { scales: { y: { beginAtZero: true } } }
            });
        }
    </script>
</body>
</html>
