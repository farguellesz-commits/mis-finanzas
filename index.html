    <style>
        /* AJUSTES VISUALES ESPECÍFICOS */
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            padding-bottom: 110px; /* Espacio para el menú inferior */
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; /* Evita el rebote elástico en iPhone */
        }

        /* Diseño de Tarjetas */
        .card { 
            background: white; 
            border-radius: 1.25rem; 
            padding: 1.25rem; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); 
            margin-bottom: 1rem; 
            border: 1px solid #f1f5f9; 
            transition: transform 0.2s ease;
        }
        
        /* Modo Oscuro para Tarjetas */
        html.dark .card { 
            background-color: #1e293b; 
            border-color: #334155; 
            color: #e2e8f0; 
        }
        
        html.dark body { 
            background-color: #0f172a; 
            color: #e2e8f0; 
        }
        
        /* Inputs y Selects */
        input, select { 
            border: 1px solid #e2e8f0 !important; 
            border-radius: 0.75rem; 
            height: 46px; 
            padding: 0 14px; 
            width: 100%; 
            outline: none; 
            font-size: 16px !important; /* Evita zoom en iPhone */
            background-color: #fff;
            color: #334155;
        }
        
        html.dark input, html.dark select { 
            background-color: #334155; 
            border-color: #475569 !important; 
            color: white; 
        }
        
        /* Sistema de Pestañas */
        .tab-content { display: none; }
        .tab-content.active { 
            display: block; 
            animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        /* Navegación Activa */
        .nav-active { 
            color: #3b82f6; 
            font-weight: 900; 
            transform: scale(1.05);
        }
        
        /* Botones de Tipo (Gasto/Ingreso) */
        .btn-tipo {
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .btn-tipo.active { 
            background-color: #3b82f6; 
            color: white; 
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="bg-slate-50 transition-colors duration-300 select-none">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Creamos un Service Worker al vuelo, sin archivo externo
                const swCode = `
                    self.addEventListener('install', (event) => {
                        self.skipWaiting(); // Fuerza la instalación inmediata
                    });
                    self.addEventListener('activate', (event) => {
                        event.waitUntil(self.clients.claim()); // Toma el control de inmediato
                    });
                    self.addEventListener('fetch', (event) => {
                        // Responde a las peticiones de red (necesario para PWA)
                        event.respondWith(fetch(event.request));
                    });
                `;
                const blob = new Blob([swCode], {type: 'text/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(blob))
                    .then(reg => console.log('Service Worker Registrado ✅', reg))
                    .catch(err => console.log('Error SW ❌', err));
            });
        }
    </script>

    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg pt-[env(safe-area-inset-top)]">
        <div>

        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-yellow-400 hover:bg-slate-700 transition">
                <i class="fas fa-moon"></i>
            </button>
            <select id="filtro-mes" onchange="cambiarMes(this.value)" class="!w-32 !h-9 !bg-slate-800 !text-white !text-[11px] font-black border-none text-center !rounded-full shadow-inner focus:ring-2 ring-blue-500"></select>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-24">

                <div class="absolute -right-6 -top-6 text-slate-800 opacity-20 transform rotate-12 group-hover:rotate-0 transition-transform duration-500">

                    <h2 id="disp-real" class="text-4xl font-black mb-6 tracking-tight">0.00€</h2>
                    
                    <div class="flex gap-3">
                        <div class="bg-white/5 backdrop-blur-sm px-3 py-2 rounded-xl flex-1 border border-white/10">
                            <p class="text-[9px] uppercase font-bold text-emerald-400 mb-1"><i class="fas fa-arrow-down"></i> Ingresos</p>
                            <p id="total-ing" class="font-black text-lg">0€</p>
                        </div>
                        <div class="bg-white/5 backdrop-blur-sm px-3 py-2 rounded-xl flex-1 border border-white/10">
                            <p class="text-[9px] uppercase font-bold text-rose-400 mb-1"><i class="fas fa-arrow-up"></i> Gastos</p>
                            <p id="total-gas" class="font-black text-lg">0€</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-l-4 border-l-blue-500">
                <h3 class="font-black text-xs uppercase text-slate-400 mb-3">Nuevo Movimiento</h3>
                
                <div class="flex gap-2 mb-4 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                    <button onclick="setTipo('Gasto')" id="btn-gas" class="btn-tipo active flex-1 py-3 rounded-lg font-black text-[10px] uppercase flex items-center justify-center gap-2">
                        <i class="fas fa-minus-circle"></i> Gasto
                    </button>
                    <button onclick="setTipo('Ingreso')" id="btn-ing" class="btn-tipo flex-1 py-3 rounded-lg font-black text-[10px] uppercase flex items-center justify-center gap-2">
                        <i class="fas fa-plus-circle"></i> Ingreso
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Fecha</label>

                <button onclick="guardarRegistro()" class="w-full bg-slate-900 dark:bg-blue-600 text-white py-4 rounded-xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 hover:bg-slate-800">

                    </h3>
                    <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded font-bold uppercase" id="stats-mes-label">Mes Actual</span>
                </div>
                <div class="h-64 relative">
                    <canvas id="chartGastos"></canvas>
                </div>
                <div class="mt-6 text-center">
                    <p class="text-xs text-slate-400">Gráfico interactivo de distribución de gastos por categoría.</p>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 flex justify-around py-2 z-50 pb-[env(safe-area-inset-bottom)] shadow-[0_-5px_10px_rgba(0,0,0,0.02)]">
        
        <button onclick="showTab('muro')" id="nav-muro" class="nav-active flex-1 flex flex-col items-center p-2 rounded-xl active:bg-slate-100 dark:active:bg-slate-800">
            <i class="fas fa-wallet text-xl mb-1"></i>
            <span class="text-[9px] font-black uppercase tracking-tighter">Muro</span>
        </button>
        
        <button onclick="showTab('stats')" id="nav-stats" class="text-slate-400 flex-1 flex flex-col items-center p-2 rounded-xl active:bg-slate-100 dark:active:bg-slate-800">
            <i class="fas fa-chart-pie text-xl mb-1"></i>
            <span class="text-[9px] font-black uppercase tracking-tighter">Gráficos</span>
        </button>
        
        <button onclick="exportarExcel()" class="text-slate-400 flex-1 flex flex-col items-center p-2 rounded-xl active:bg-slate-100 dark:active:bg-slate-800">
            <i class="fas fa-file-excel text-xl mb-1 text-emerald-600"></i>
            <span class="text-[9px] font-black uppercase tracking-tighter">Excel</span>

        <button onclick="borrarTodo()" class="text-slate-400 flex-1 flex flex-col items-center p-2 rounded-xl active:bg-slate-100 dark:active:bg-slate-800">

    <script>
        // CONFIGURACIÓN DE BASE DE DATOS LOCAL
        const DB_KEY = 'FINANZAS_PRO_DATA'; // Clave única para guardar datos
        
        // Estado inicial de la aplicación
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
            movs: [],
            config: {
                cats: {
                    Gasto: ['Alimentación', 'Vivienda', 'Transporte', 'Ocio', 'Salud', 'Compras', 'Varios'],
                    Ingreso: ['Nómina', 'Negocio', 'Inversiones', 'Regalo', 'Otros']
                }
            }
        };

        let tipoActual = 'Gasto';
        let mesSeleccionado = new Date().toISOString().slice(0, 7); // YYYY-MM
        let myChart = null; // Variable para el gráfico

        // --- FUNCIONES DE GUARDADO ---
        function save() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        // --- SISTEMA DE NAVEGACIÓN ---
        function showTab(tabId) {
            // Ocultar todas las pestañas
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            // Desactivar todos los botones del menú
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('nav-active');
                b.classList.add('text-slate-400');
            });
            
            // Activar la pestaña seleccionada
            document.getElementById(tabId).classList.add('active');
            
            // Activar el botón correspondiente
            const activeBtn = document.getElementById('nav-' + tabId);
            activeBtn.classList.add('nav-active');
            activeBtn.classList.remove('text-slate-400');
            
            // Si es la pestaña de estadísticas, renderizar gráfico
            if(tabId === 'stats') {
                renderChart();
                document.getElementById('stats-mes-label').innerText = mesSeleccionado;
            }
        }

        function setTipo(tipo) {
            tipoActual = tipo;
            
            // Gestión visual de los botones Gasto/Ingreso
            const btnGas = document.getElementById('btn-gas');
            const btnIng = document.getElementById('btn-ing');
            
            if (tipo === 'Gasto') {
                btnGas.classList.add('active');
                btnIng.classList.remove('active');
            } else {
                btnIng.classList.add('active');
                btnGas.classList.remove('active');
            }
            
            cargarCategorias();
        }

        function cargarCategorias() {
            const select = document.getElementById('in-cat');
            // Cargar las categorías según el tipo seleccionado
            const categorias = db.config.cats[tipoActual];
            
            select.innerHTML = categorias.map(c => 
                `<option value="${c}">${c}</option>`
            ).join('');
        }

        // --- LÓGICA DE NEGOCIO (CRUD) ---
        function guardarRegistro() {
            // Obtener valores del formulario
            const valorInput = document.getElementById('in-valor');
            const fechaInput = document.getElementById('in-fecha');
            const catInput = document.getElementById('in-cat');
            const notaInput = document.getElementById('in-nota');
            
            const valor = parseFloat(valorInput.value);
            const fecha = fechaInput.value;
            
            // Validación básica
            if(!valor || !fecha) {
                alert("⚠️ Por favor, introduce una fecha y un importe válido.");
                return;
            }

            // Crear el objeto movimiento
            const nuevoMovimiento = {
                id: Date.now(), // ID único basado en el tiempo
                fecha: fecha,
                valor: valor,
                tipo: tipoActual,
                cat: catInput.value,
                nota: notaInput.value.trim().toUpperCase()
            };

            // Guardar en array y persistir
            db.movs.push(nuevoMovimiento);
            save();
            
            // Actualizar la vista y limpiar formulario
            actualizarUI();
            valorInput.value = "";
            notaInput.value = "";
            
            // Feedback visual (vibración si es móvil)
            if(navigator.vibrate) navigator.vibrate(50);
        }

        function borrarMov(id) {
            if(confirm("¿Estás seguro de querer eliminar este movimiento?")) {
                db.movs = db.movs.filter(m => m.id !== id);
                save();
                actualizarUI();
            }
        }

        // --- ACTUALIZACIÓN DE INTERFAZ (UI) ---
        function actualizarUI() {
            // 1. Gestionar el Selector de Meses
            // Obtenemos todos los meses únicos disponibles en los datos
            const mesesDisponibles = [...new Set(db.movs.map(m => m.fecha.slice(0, 7)))].sort().reverse();
            
            // Aseguramos que el mes actual/seleccionado esté en la lista
            if(!mesesDisponibles.includes(mesSeleccionado)) {
                mesesDisponibles.unshift(mesSeleccionado);
            }
            
            // Renderizamos el select
            document.getElementById('filtro-mes').innerHTML = mesesDisponibles.map(m => 
                `<option value="${m}" ${m===mesSeleccionado?'selected':''}>${m}</option>`
            ).join('');

            // 2. Filtrar movimientos del mes seleccionado
            const movimientosMes = db.movs.filter(m => m.fecha.startsWith(mesSeleccionado)).sort((a,b) => b.id - a.id);
            
            // 3. Calcular Totales
            let totalIngresos = 0;
            let totalGastos = 0;
            
            const contenedorLista = document.getElementById('lista-movs');
            contenedorLista.innerHTML = ""; // Limpiar lista anterior

            if (movimientosMes.length === 0) {
                contenedorLista.innerHTML = `
                    <div class="text-center text-slate-400 py-10 opacity-50">
                        <i class="fas fa-receipt text-4xl mb-2"></i>
                        <p class="text-xs font-bold uppercase">Sin movimientos este mes</p>
                    </div>`;
            }

            // 4. Renderizar Lista
            movimientosMes.forEach(m => {
                if(m.tipo === 'Ingreso') totalIngresos += m.valor; else totalGastos += m.valor;
                
                // Formatear fecha para mostrar (DD/MM)
                const dia = m.fecha.split('-')[2];
                const mes = m.fecha.split('-')[1];
                
                const colorBorde = m.tipo === 'Ingreso' ? 'border-emerald-500' : 'border-rose-500';
                const colorTexto = m.tipo === 'Ingreso' ? 'text-emerald-500' : 'text-rose-500';
                const icono = m.tipo === 'Ingreso' ? 'fa-arrow-up' : 'fa-arrow-down';
                
                contenedorLista.innerHTML += `
                    <div class="card p-4 flex justify-between items-center border-l-[6px] ${colorBorde} animate-[fadeIn_0.2s_ease-out]">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-slate-100 dark:bg-slate-700 text-slate-500 text-[10px] font-black px-2 py-0.5 rounded uppercase">
                                    ${dia}/${mes}
                                </span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                                    ${m.cat}
                                </span>
                            </div>
                            <p class="text-sm font-bold text-slate-700 dark:text-slate-200 leading-tight">
                                ${m.nota || m.cat}
                            </p>
                        </div>
                        <div class="text-right pl-4">
                            <div class="font-black text-lg ${colorTexto}">
                                ${m.valor.toFixed(2)}€
                            </div>
                            <button onclick="borrarMov(${m.id})" class="text-slate-300 hover:text-rose-500 transition p-2 -mr-2">
                                <i class="fas fa-trash-alt text-xs"></i>
                            </button>
                        </div>
                    </div>`;
            });

            // 5. Actualizar Marcadores
            document.getElementById('disp-real').innerText = (totalIngresos - totalGastos).toFixed(2) + "€";
            document.getElementById('total-ing').innerText = totalIngresos.toFixed(0) + "€";
            document.getElementById('total-gas').innerText = totalGastos.toFixed(0) + "€";
            
            // Colorear el balance según sea positivo o negativo
            const balanceElem = document.getElementById('disp-real');
            if(totalIngresos - totalGastos >= 0) {
                balanceElem.className = "text-4xl font-black mb-6 tracking-tight text-white";
            } else {
                balanceElem.className = "text-4xl font-black mb-6 tracking-tight text-rose-400";
            }
        }

        function cambiarMes(mes) { 
            mesSeleccionado = mes; 
            actualizarUI(); 
            if(document.getElementById('stats').classList.contains('active')) {
                renderChart();
                document.getElementById('stats-mes-label').innerText = mes;
            }
        }

        // --- GRÁFICOS (Chart.js) ---
        function renderChart() {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            
            // Filtrar solo gastos del mes
            const datosGastos = db.movs.filter(m => m.fecha.startsWith(mesSeleccionado) && m.tipo === 'Gasto');
            
            // Agrupar por categoría
            const totalesPorCat = {};
            datosGastos.forEach(g => {
                totalesPorCat[g.cat] = (totalesPorCat[g.cat] || 0) + g.valor;
            });
            
            // Si no hay datos, mostrar gráfico vacío o limpiar
            if(Object.keys(totalesPorCat).length === 0) {
                if(myChart) {
                    myChart.data.datasets[0].data = [];
                    myChart.data.labels = [];
                    myChart.update();
                }
                return;
            }

            const configGrafico = {
                type: 'doughnut',
                data: {
                    labels: Object.keys(totalesPorCat),
                    datasets: [{
                        data: Object.values(totalesPorCat),
                        backgroundColor: [
                            '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#6366f1'
                        ],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: { 
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { 
                            position: 'bottom', 
                            labels: { 
                                font: { size: 11, weight: 'bold', family: 'system-ui' },
                                padding: 20,
                                usePointStyle: true
                            } 
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    if (label) label += ': ';
                                    label += context.raw.toFixed(2) + '€';
                                    return label;
                                }
                            }
                        }
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true
                    }
                }
            };

            if(myChart) {
                myChart.destroy();
            }
            myChart = new Chart(ctx, configGrafico);
        }

        // --- EXPORTACIÓN A EXCEL ---
        function exportarExcel() {
            if(db.movs.length === 0) return alert("No hay datos para exportar.");
            
            // Crear una copia de los datos para formatearlos mejor
            const datosParaExcel = db.movs.map(m => ({
                Fecha: m.fecha,
                Tipo: m.tipo,
                Categoría: m.cat,
                Nota: m.nota,
                Importe: m.valor
            }));

            const ws = XLSX.utils.json_to_sheet(datosParaExcel);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Mis Finanzas");
            
            // Nombre del archivo con fecha de hoy
            const fechaHoy = new Date().toISOString().slice(0,10);
            XLSX.writeFile(wb, `Backup_Finanzas_${fechaHoy}.xlsx`);
        }

        // --- UTILIDADES ---
        function toggleTheme() { 
            document.documentElement.classList.toggle('dark'); 
            // Guardar preferencia (opcional, pero mejora la UX)
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function borrarTodo() { 
            if(confirm("⚠️ ATENCIÓN ⚠️\n\n¿Estás seguro de que quieres BORRAR TODOS LOS DATOS?\nEsta acción no se puede deshacer.")) { 
                localStorage.removeItem(DB_KEY); 
                location.reload(); 
            } 
        }

        // --- INICIALIZACIÓN ---
        window.onload = () => {
            // Establecer fecha de hoy en el input
            document.getElementById('in-fecha').valueAsDate = new Date();
            
            // Cargar tema guardado si existe
            if(localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
            }
            
            setTipo('Gasto'); // Iniciar en pestaña Gasto
            actualizarUI();   // Pintar la interfaz
        };
    </script>
</body>
</html>
