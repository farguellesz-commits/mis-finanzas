<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Finanzas V17","short_name":"Finanzas","display":"standalone","start_url":".","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2489/2489756.png","sizes":"512x512","type":"image/png"}]}'>

    <title>FINANZAS V17.3</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
        .card { background: white; border-radius: 1.5rem; padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 1rem; border: 1px solid #e2e8f0; }
        .btn-tipo { flex: 1; padding: 12px; border-radius: 1rem; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; background: #f1f5f9; color: #64748b; }
        .btn-tipo.active { background: #1e293b; color: white; }
        input, select { height: 50px; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 0 15px; width: 100%; outline: none; font-size: 16px; }
        .nav-btn { color: #94a3b8; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .nav-btn.active { color: #3b82f6; }
        .tab-content { display: none; max-width: 600px; margin: 0 auto; padding: 1rem; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        
        /* CALCULADORA */
        #calc-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #1e293b; padding: 20px; border-radius: 2rem; width: 90%; max-width: 320px; }
        .calc-btn { background: #334155; color: white; height: 55px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; }
        .calc-btn.op { background: #3b82f6; }
        .calc-btn.ok { background: #10b981; grid-column: span 2; }
        .calc-btn.clear { background: #ef4444; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header class="bg-slate-900 text-white p-5 sticky top-0 z-50 flex justify-between items-center shadow-xl pt-[env(safe-area-inset-top)]">
        <h1 class="text-xl font-black italic">V17.3 <span class="text-emerald-400">FINANZAS</span></h1>
        <select id="filtro-mes" onchange="cambiarMes(this.value)" class="!w-32 !h-9 !bg-slate-800 !text-white !text-xs font-black border-none !rounded-full"></select>
    </header>

    <main id="tab-muro" class="tab-content active">
        <div class="card bg-slate-900 text-white border-none mb-4">
            <p class="text-[10px] font-black uppercase text-emerald-400 mb-1">Disponible Real</p>
            <h2 id="saldo-total" class="text-4xl font-black mb-4">0€</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white/5 p-2 rounded-xl border border-white/10">
                    <p class="text-[8px] text-slate-400 uppercase">Ingresos</p>
                    <p id="total-ing" class="text-sm font-bold text-emerald-400">0€</p>
                </div>
                <div class="bg-white/5 p-2 rounded-xl border border-white/10">
                    <p class="text-[8px] text-slate-400 uppercase">Gastos</p>
                    <p id="total-gas" class="text-sm font-bold text-rose-400">0€</p>
                </div>
                <div class="bg-white/5 p-2 rounded-xl border border-white/10">
                    <p class="text-[8px] text-slate-400 uppercase">Gastos Fijos</p>
                    <p id="total-fijos" class="text-sm font-bold text-blue-400">0€</p>
                </div>
                <div class="bg-white/5 p-2 rounded-xl border border-white/10">
                    <p class="text-[8px] text-slate-400 uppercase">Extras/Ocio</p>
                    <p id="total-extras" class="text-sm font-bold text-amber-400">0€</p>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="flex gap-2 mb-4">
                <button onclick="setTipo('Ingreso')" id="t-ing" class="btn-tipo active">Ingreso</button>
                <button onclick="setTipo('Gasto')" id="t-gas" class="btn-tipo">Gasto</button>
            </div>
            <div class="space-y-3">
                <div class="flex gap-2">
                    <input type="date" id="in-fecha" class="font-bold text-sm w-2/5">
                    <div class="relative flex-1">
                        <input type="number" id="in-valor" placeholder="0.00" class="font-black text-right pr-10">
                        <button onclick="abrirCalc()" class="absolute right-3 top-3 text-blue-500"><i class="fas fa-calculator text-lg"></i></button>
                    </div>
                </div>
                <select id="in-cat" class="font-bold text-xs uppercase"></select>
                <input type="text" id="in-nota" placeholder="Concepto..." class="text-sm">
                <button onclick="guardar()" id="btn-main" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg">Guardar Movimiento</button>
                <button onclick="cancelarEdicion()" id="btn-cancel" class="hidden w-full text-xs text-slate-400 font-bold py-2">CANCELAR EDICIÓN</button>
            </div>
        </div>

        <div class="relative mb-4">
            <i class="fas fa-search absolute left-4 top-4 text-slate-300"></i>
            <input type="text" id="buscador" onkeyup="render()" placeholder="Buscar..." class="pl-12 !h-12 text-sm font-bold uppercase border-none shadow-sm">
        </div>

        <div id="lista-movs" class="space-y-3"></div>
    </main>

    <div id="tab-huchas" class="tab-content">
        <div class="card">
            <h3 class="font-black text-xs uppercase mb-4 text-slate-400">Huchas / Objetivos</h3>
            <div id="lista-huchas-render" class="space-y-4"></div>
        </div>
    </div>

    <div id="tab-graficos" class="tab-content">
        <div class="card"><canvas id="chart-pie"></canvas></div>
        <div class="card"><canvas id="chart-bar"></canvas></div>
    </div>

    <div id="tab-ajustes" class="tab-content">
        <div class="card">
            <h3 class="font-black text-blue-600 text-xs uppercase mb-4">📊 Control Presupuestario</h3>
            <div id="lista-presupuestos" class="space-y-2"></div>
        </div>
        <div class="card">
            <h3 class="font-black text-xs uppercase mb-4">Mantenimiento</h3>
            <button onclick="exportar()" class="w-full bg-slate-100 py-3 rounded-xl font-bold text-[10px] uppercase">Exportar Datos (Copia)</button>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t flex justify-around py-3 pb-[env(safe-area-inset-bottom)] z-50">
        <button onclick="ir('muro')" id="n-muro" class="nav-btn active"><i class="fas fa-wallet text-xl"></i>Muro</button>
        <button onclick="ir('huchas')" id="n-huchas" class="nav-btn"><i class="fas fa-piggy-bank text-xl"></i>Huchas</button>
        <button onclick="ir('graficos')" id="n-graficos" class="nav-btn"><i class="fas fa-chart-pie text-xl"></i>Gráficos</button>
        <button onclick="ir('ajustes')" id="n-ajustes" class="nav-btn"><i class="fas fa-cog text-xl"></i>Ajustes</button>
    </nav>

    <div id="calc-modal">
        <div class="calc-grid">
            <div class="col-span-4 bg-slate-900 text-white text-right text-3xl font-mono p-4 rounded-xl mb-2" id="calc-display">0</div>
            <button onclick="calcInput('7')" class="calc-btn">7</button>
            <button onclick="calcInput('8')" class="calc-btn">8</button>
            <button onclick="calcInput('9')" class="calc-btn">9</button>
            <button onclick="calcOp('/')" class="calc-btn op">÷</button>
            <button onclick="calcInput('4')" class="calc-btn">4</button>
            <button onclick="calcInput('5')" class="calc-btn">5</button>
            <button onclick="calcInput('6')" class="calc-btn">6</button>
            <button onclick="calcOp('*')" class="calc-btn op">×</button>
            <button onclick="calcInput('1')" class="calc-btn">1</button>
            <button onclick="calcInput('2')" class="calc-btn">2</button>
            <button onclick="calcInput('3')" class="calc-btn">3</button>
            <button onclick="calcOp('-')" class="calc-btn op">-</button>
            <button onclick="calcClear()" class="calc-btn clear">C</button>
            <button onclick="calcInput('0')" class="calc-btn">0</button>
            <button onclick="calcInput('.')" class="calc-btn">.</button>
            <button onclick="calcOp('+')" class="calc-btn op">+</button>
            <button onclick="cerrarCalc()" class="calc-btn col-span-2 bg-slate-600">CERRAR</button>
            <button onclick="calcOk()" class="calc-btn ok col-span-2">OK</button>
        </div>
    </div>

    <script>
        const DB_NAME = 'FINANZAS_V17_RECOVERED';
        let db = JSON.parse(localStorage.getItem(DB_NAME)) || { 
            movs: [], 
            cats: ['COMPRAS', 'PENSION', 'PISO P. SÁNC', 'VIDA DIARIA', 'FUENTIDUEÑA', 'COCHE', 'PERSONALES', 'FAMILIA', 'ALQUILERES', 'GARAJE EMV', 'GARAJE FLEM', 'PISO CHILE', 'EMPRESA', 'VARIOS', 'SALUD', 'INVERSIONES MAPFRE'],
            presupuestos: {},
            huchas: [{nombre: 'FONDO EMERGENCIA', meta: 1000, actual: 0}]
        };

        let tipoActual = 'Gasto';
        let idEditando = null;
        let mesAct = new Date().toISOString().slice(0,7);
        let myCharts = {};

        // CALC
        let calcVal = "0", calcOpPend = null, calcPrevVal = 0, nuevoNum = true;

        window.onload = () => {
            document.getElementById('in-fecha').valueAsDate = new Date();
            actualizarCats();
            render();
        };

        function abrirCalc() { document.getElementById('calc-modal').style.display = 'flex'; calcClear(); }
        function cerrarCalc() { document.getElementById('calc-modal').style.display = 'none'; }
        function calcInput(n) { if(nuevoNum){calcVal=n; nuevoNum=false;} else {calcVal+=n;} document.getElementById('calc-display').innerText=calcVal; }
        function calcOp(op) {
            const v = parseFloat(calcVal);
            if(calcOpPend && !nuevoNum) {
                if(calcOpPend==='+') calcPrevVal += v;
                if(calcOpPend==='-') calcPrevVal -= v;
                if(calcOpPend==='*') calcPrevVal *= v;
                if(calcOpPend==='/') calcPrevVal /= v;
                calcVal = String(calcPrevVal);
            } else { calcPrevVal = v; }
            calcOpPend = op; nuevoNum = true;
            document.getElementById('calc-display').innerText = calcVal;
        }
        function calcClear() { calcVal="0"; calcOpPend=null; calcPrevVal=0; nuevoNum=true; document.getElementById('calc-display').innerText="0"; }
        function calcOk() { if(calcOpPend) calcOp('='); document.getElementById('in-valor').value = parseFloat(calcVal).toFixed(2); cerrarCalc(); }

        function ir(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+tab).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('n-'+tab).classList.add('active');
            if(tab === 'graficos') renderGraficos();
            if(tab === 'ajustes') renderPresupuestos();
            if(tab === 'huchas') renderHuchas();
        }

        function setTipo(t) {
            tipoActual = t;
            document.getElementById('t-ing').className = t === 'Ingreso' ? 'btn-tipo active' : 'btn-tipo';
            document.getElementById('t-gas').className = t === 'Gasto' ? 'btn-tipo active' : 'btn-tipo';
        }

        function guardar() {
            const val = parseFloat(document.getElementById('in-valor').value);
            const cat = document.getElementById('in-cat').value;
            const nota = document.getElementById('in-nota').value.toUpperCase();
            if(!val || !cat) return;
            const mov = { id: idEditando || Date.now(), fecha: document.getElementById('in-fecha').value, tipo: tipoActual, cat, nota, valor: val };
            if(idEditando) { db.movs = db.movs.map(m => m.id === idEditando ? mov : m); idEditando = null; }
            else { db.movs.push(mov); }
            save(); render();
            document.getElementById('in-valor').value = ""; document.getElementById('in-nota').value = "";
            document.getElementById('btn-main').innerText = "Guardar Movimiento"; document.getElementById('btn-cancel').classList.add('hidden');
        }

        function render() {
            const q = document.getElementById('buscador').value.toUpperCase();
            const meses = [...new Set(db.movs.map(m => m.fecha.slice(0,7)))].sort().reverse();
            if(!meses.includes(mesAct)) meses.unshift(mesAct);
            document.getElementById('filtro-mes').innerHTML = meses.map(m => `<option value="${m}" ${m===mesAct?'selected':''}>${m}</option>`).join('');

            let ing=0, gas=0, fijos=0, extras=0;
            const filtrados = db.movs.filter(m => m.fecha.startsWith(mesAct));
            
            document.getElementById('lista-movs').innerHTML = filtrados
                .filter(m => m.nota.includes(q) || m.cat.includes(q) || m.valor.toString().includes(q))
                .sort((a,b) => new Date(b.fecha) - new Date(a.fecha))
                .map(m => {
                    if(m.tipo==='Ingreso') ing += m.valor;
                    else {
                        gas += m.valor;
                        if(['PISO P. SÁNC', 'COCHE', 'GARAJE EMV', 'GARAJE FLEM', 'PISO CHILE', 'SALUD'].includes(m.cat)) fijos += m.valor;
                        else extras += m.valor;
                    }
                    return `
                    <div class="card p-4 flex justify-between items-center border-l-4 ${m.tipo==='Ingreso'?'border-emerald-400':'border-rose-400'}">
                        <div onclick="prepararEdicion(${m.id})" class="flex-1">
                            <p class="text-[9px] font-black text-slate-400 uppercase">${m.cat} • ${m.fecha.split('-')[2]}</p>
                            <p class="font-bold text-sm text-slate-700">${m.nota || 'SIN NOTA'}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-black text-lg ${m.tipo==='Ingreso'?'text-emerald-600':'text-rose-600'}">${m.valor.toFixed(2)}€</p>
                            <button onclick="borrar(${m.id})" class="text-slate-300 text-[10px]"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                }).join('');

            document.getElementById('saldo-total').innerText = (ing - gas).toFixed(2) + "€";
            document.getElementById('total-ing').innerText = ing.toFixed(0) + "€";
            document.getElementById('total-gas').innerText = gas.toFixed(0) + "€";
            document.getElementById('total-fijos').innerText = fijos.toFixed(0) + "€";
            document.getElementById('total-extras').innerText = extras.toFixed(0) + "€";
        }

        function renderHuchas() {
            document.getElementById('lista-huchas-render').innerHTML = db.huchas.map((h, i) => {
                const disponible = h.meta - h.actual;
                return `
                <div class="bg-slate-50 p-4 rounded-xl">
                    <div class="flex justify-between text-[10px] font-black uppercase mb-1">
                        <span>${h.nombre}</span>
                        <span class="text-emerald-600">Faltan: ${disponible.toFixed(0)}€</span>
                    </div>
                    <div class="w-full bg-slate-200 h-2 rounded-full mb-3"><div class="bg-emerald-500 h-full rounded-full" style="width:${(h.actual/h.meta)*100}%"></div></div>
                    <div class="flex gap-2">
                        <input type="number" placeholder="Importe..." id="h-val-${i}" class="!h-8 !text-xs">
                        <button onclick="addHucha(${i})" class="bg-slate-900 text-white px-3 rounded-lg text-xs font-bold">OK</button>
                    </div>
                </div>`;
            }).join('');
        }
        function addHucha(i) { const v = parseFloat(document.getElementById(`h-val-${i}`).value)||0; db.huchas[i].actual += v; save(); renderHuchas(); }

        function renderPresupuestos() {
            document.getElementById('lista-presupuestos').innerHTML = db.cats.sort().map(cat => {
                const gastado = db.movs.filter(m => m.cat === cat && m.tipo === 'Gasto' && m.fecha.startsWith(mesAct)).reduce((a,b)=>a+b.valor,0);
                const meta = db.presupuestos[cat] || 0;
                const movs = db.movs.filter(m => m.cat === cat && m.tipo === 'Gasto' && m.fecha.startsWith(mesAct));
                return `
                <details class="bg-slate-50 rounded-xl border">
                    <summary class="p-3 list-none cursor-pointer">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-black text-[10px] uppercase">${cat}</span>
                            <input type="number" value="${meta}" onchange="setPresu('${cat}', this.value)" class="!w-16 !h-6 !p-1 text-right text-[10px]">
                        </div>
                        <div class="flex justify-between text-[9px] font-bold uppercase">
                            <span class="text-rose-400">Gasto: ${gastado.toFixed(0)}€</span>
                            <span class="${meta-gastado>=0?'text-emerald-500':'text-rose-600'}">Disponible: ${(meta-gastado).toFixed(0)}€</span>
                        </div>
                    </summary>
                    <div class="p-2 border-t text-[9px] space-y-1">
                        ${movs.map(m => `<div>${m.fecha.split('-')[2]} - ${m.nota}: ${m.valor}€</div>`).join('') || 'Sin gastos'}
                    </div>
                </details>`;
            }).join('');
        }
        function setPresu(c, v) { db.presupuestos[c] = parseFloat(v); save(); renderPresupuestos(); }

        function renderGraficos() {
            const gas = db.movs.filter(m => m.fecha.startsWith(mesAct) && m.tipo === 'Gasto');
            const dataP = {}; gas.forEach(m => dataP[m.cat] = (dataP[m.cat] || 0) + m.valor);
            if(myCharts.pie) myCharts.pie.destroy();
            myCharts.pie = new Chart(document.getElementById('chart-pie'), { type: 'doughnut', data: { labels: Object.keys(dataP), datasets: [{ data: Object.values(dataP), backgroundColor: ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6'] }]}});
            
            const ultimos = [...new Set(db.movs.map(m => m.fecha.slice(0,7)))].sort().slice(-5);
            if(myCharts.bar) myCharts.bar.destroy();
            myCharts.bar = new Chart(document.getElementById('chart-bar'), { type: 'bar', data: { labels: ultimos, datasets: [{ label: 'Mensual', data: ultimos.map(m => db.movs.filter(x => x.fecha.startsWith(m) && x.tipo === 'Gasto').reduce((a,b)=>a+b.valor,0)), backgroundColor: '#1e293b' }]}});
        }

        function actualizarCats() { document.getElementById('in-cat').innerHTML = db.cats.sort().map(c => `<option value="${c}">${c}</option>`).join(''); }
        function save() { localStorage.setItem(DB_NAME, JSON.stringify(db)); }
        function cambiarMes(v) { mesAct = v; render(); }
        function borrar(id) { if(confirm("¿Eliminar?")) { db.movs = db.movs.filter(m => m.id !== id); save(); render(); } }
        function exportar() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type: 'application/json'})); a.download = `BACKUP_${mesAct}.json`; a.click(); }
        function prepararEdicion(id) {
            const m = db.movs.find(x => x.id === id);
            idEditando = id;
            document.getElementById('in-fecha').value = m.fecha;
            document.getElementById('in-valor').value = m.valor;
            document.getElementById('in-nota').value = m.nota;
            document.getElementById('in-cat').value = m.cat;
            setTipo(m.tipo);
            document.getElementById('btn-main').innerText = "ACTUALIZAR";
            document.getElementById('btn-cancel').classList.remove('hidden');
            window.scrollTo(0,0);
        }
        function cancelarEdicion() { idEditando = null; document.getElementById('btn-main').innerText = "Guardar Movimiento"; document.getElementById('btn-cancel').classList.add('hidden'); }
    </script>
</body>
</html>
