<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanzas">
    <meta name="theme-color" content="#0f172a">
    
    <title>FINANZAS V17.5</title>
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"Finanzas Pro","short_name":"Finanzas","start_url":"./","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2489/2489756.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding-bottom: 110px; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .card { background: white; border-radius: 1.25rem; padding: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 1rem; border: 1px solid #f1f5f9; }
        html.dark .card { background-color: #1e293b; border-color: #334155; color: #e2e8f0; }
        html.dark body { background-color: #0f172a; color: #e2e8f0; }
        input, select { border: 1px solid #e2e8f0 !important; border-radius: 0.75rem; height: 44px; padding: 0 12px; width: 100%; outline: none; font-size: 14px !important; }
        html.dark input, html.dark select { background-color: #334155; border-color: #475569 !important; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-active { color: #3b82f6; border-top: 3px solid #3b82f6; font-weight: 900; background: rgba(59, 130, 246, 0.05); }
        
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10001; transition: all 0.3s ease; opacity: 0; pointer-events: none; }
        #toast-container.show { opacity: 1; }
        .toast-msg { background: rgba(15, 23, 42, 0.95); color: white; padding: 12px 24px; border-radius: 50px; font-size: 12px; font-weight: 800; text-transform: uppercase; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; }

        /* CALCULADORA */
        #calc-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #1e293b; padding: 20px; border-radius: 2rem; width: 90%; max-width: 340px; }
        .calc-btn { background: #334155; color: white; height: 60px; border-radius: 12px; font-size: 1.4rem; font-weight: bold; display: flex; justify-content: center; align-items: center; }
        .calc-btn:active { background: #475569; }
        .calc-btn.op { background: #3b82f6; }
        .calc-btn.ok { background: #10b981; grid-column: span 2; }
        .calc-btn.clear { background: #ef4444; }
        .calc-display { grid-column: span 4; background: #0f172a; color: white; font-size: 2.5rem; text-align: right; padding: 1rem; border-radius: 1rem; margin-bottom: 1rem; font-family: monospace; overflow: hidden; }
    </style>
</head>
<body class="light">

    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', function(event) { event.respondWith(fetch(event.request)); });`;
            const blob = new Blob([swCode], {type: 'text/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl);
        }
    </script>

    <div id="toast-container"><div class="toast-msg"><i class="fas fa-check-circle text-emerald-400"></i> <span id="toast-text">Acción realizada</span></div></div>

    <div id="calc-modal">
        <div class="calc-grid">
            <div id="calc-display" class="calc-display">0</div>
            <button onclick="calcIn('7')" class="calc-btn">7</button>
            <button onclick="calcIn('8')" class="calc-btn">8</button>
            <button onclick="calcIn('9')" class="calc-btn">9</button>
            <button onclick="calcOp('/')" class="calc-btn op">÷</button>
            <button onclick="calcIn('4')" class="calc-btn">4</button>
            <button onclick="calcIn('5')" class="calc-btn">5</button>
            <button onclick="calcIn('6')" class="calc-btn">6</button>
            <button onclick="calcOp('*')" class="calc-btn op">×</button>
            <button onclick="calcIn('1')" class="calc-btn">1</button>
            <button onclick="calcIn('2')" class="calc-btn">2</button>
            <button onclick="calcIn('3')" class="calc-btn">3</button>
            <button onclick="calcOp('-')" class="calc-btn op">-</button>
            <button onclick="calcClear()" class="calc-btn clear">C</button>
            <button onclick="calcIn('0')" class="calc-btn">0</button>
            <button onclick="calcIn('.')" class="calc-btn">.</button>
            <button onclick="calcOp('+')" class="calc-btn op">+</button>
            <button onclick="cerrarCalc()" class="calc-btn" style="background: #475569; grid-column: span 2; font-size: 1rem;">CANCELAR</button>
            <button onclick="calcOk()" class="calc-btn ok">OK</button>
        </div>
    </div>

    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg pt-[env(safe-area-inset-top)]">
        <div class="flex items-center gap-3">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-yellow-400"><i id="theme-icon" class="fas fa-moon"></i></button>
            <div>
                <h1 class="font-black italic text-xl uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 leading-none">V17.5</h1>
                <p id="mes-header" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest"></p>
            </div>
        </div>
        <select id="filtro-mes" onchange="cambiarMes(this.value)" class="!w-32 !h-9 !bg-slate-800 !text-white !text-xs font-black border-none text-center !rounded-full"></select>
    </header>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 flex justify-around z-50 pb-[env(safe-area-inset-bottom)]">
        <button onclick="showTab('muro')" id="nav-muro" class="flex-1 py-3 text-center nav-active"><i class="fas fa-wallet text-lg mb-1"></i><br><span class="text-[9px] uppercase font-black">Muro</span></button>
        <button onclick="showTab('graficos')" id="nav-graficos" class="flex-1 py-3 text-center text-slate-400"><i class="fas fa-chart-pie text-lg mb-1"></i><br><span class="text-[9px] uppercase font-black">Gráficos</span></button>
        <button onclick="showTab('huchas')" id="nav-huchas" class="flex-1 py-3 text-center text-slate-400"><i class="fas fa-piggy-bank text-lg mb-1"></i><br><span class="text-[9px] uppercase font-black">Huchas</span></button>
        <button onclick="showTab('config')" id="nav-config" class="flex-1 py-3 text-center text-slate-400"><i class="fas fa-sliders-h text-lg mb-1"></i><br><span class="text-[9px] uppercase font-black">Ajustes</span></button>
    </nav>

    <div id="muro" class="tab-content active p-3 max-w-2xl mx-auto">
        <div class="card bg-slate-900 text-white border-none p-0 overflow-hidden shadow-2xl mb-4">
            <div class="p-5 text-center bg-gradient-to-br from-slate-800 to-slate-950">
                <p class="text-[10px] text-blue-400 uppercase font-black tracking-[0.3em] mb-1">Disponible Real</p>
                <h2 id="disp-real" class="text-4xl font-black tracking-tighter mb-2">0.00€</h2>
                <div class="inline-flex items-center gap-2 bg-slate-800/80 px-3 py-1 rounded-full">
                    <span class="text-[10px] text-slate-400 uppercase font-bold">PATRIMONIO:</span>
                    <span id="patrimonio-total" class="text-xs font-black text-white">0.00€</span>
                </div>
            </div>
            <div class="grid grid-cols-3 divide-x divide-white/10 bg-slate-900/50 text-center py-2">
                <div><p class="text-[8px] text-emerald-500 font-black">ING. FIJO</p><p id="sum-ing-fijo" class="text-xs font-bold">0€</p></div>
                <div><p class="text-[8px] text-teal-400 font-black">ING. VAR</p><p id="sum-ing-var" class="text-xs font-bold">0€</p></div>
                <div><p class="text-[8px] text-cyan-400 font-black">ING. EXTRA</p><p id="sum-ing-extra" class="text-xs font-bold">0€</p></div>
            </div>
        </div>

        <div class="card border-l-4 border-blue-500 shadow-lg">
            <div class="flex gap-2 mb-3">
                <button onclick="setTipoMuro('Ingreso')" id="t-Ingreso" class="btn-tipo active" style="flex:1; height:40px; border-radius:0.75rem; font-weight:800; font-size:0.7rem; text-transform:uppercase;">Ingreso</button>
                <button onclick="setTipoMuro('Gasto')" id="t-Gasto" class="btn-tipo" style="flex:1; height:40px; border-radius:0.75rem; font-weight:800; font-size:0.7rem; text-transform:uppercase;">Gasto</button>
            </div>
            <div class="flex gap-2 mb-3">
                <input type="date" id="in-fecha" style="width:45%">
                <div style="width:55%; position:relative;">
                    <input type="number" step="0.01" id="in-valor" placeholder="0.00 €" class="text-right pr-10 font-black text-blue-600">
                    <button onclick="abrirCalc()" class="absolute right-2 top-2 text-slate-400"><i class="fas fa-calculator"></i></button>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-3">
                <select id="in-cat" onchange="cargarConceptosMuro()"></select>
                <select id="in-con"></select>
            </div>
            <input type="text" id="in-nota" placeholder="Detalle (Opcional)" class="mb-3">
            <div class="flex gap-2">
                <label class="flex-1 flex items-center justify-center gap-2 p-2 bg-slate-50 rounded-lg">
                    <input type="checkbox" id="in-fijo" onchange="checkLogic('fijo')"> <span class="text-[10px] font-black">FIJO</span>
                </label>
                <label class="flex-1 flex items-center justify-center gap-2 p-2 bg-slate-50 rounded-lg">
                    <input type="checkbox" id="in-extra" onchange="checkLogic('extra')"> <span class="text-[10px] font-black">EXTRA</span>
                </label>
            </div>
            <button onclick="guardarRegistro()" id="btn-guardar" class="w-full bg-slate-900 text-white py-3 rounded-xl font-black text-xs uppercase mt-4">Guardar Movimiento</button>
        </div>

        <div class="mt-4 space-y-3" id="lista-movs"></div>
    </div>

    <div id="huchas" class="tab-content p-4 max-w-2xl mx-auto">
        <div class="card border-l-4 border-purple-500">
            <h3 class="text-[10px] font-black text-purple-500 uppercase mb-3">Nueva Hucha</h3>
            <div class="flex gap-2 mb-2">
                <input type="text" id="hucha-nombre" placeholder="Nombre">
                <input type="number" id="hucha-meta" placeholder="Meta €" style="width:100px">
            </div>
            <button onclick="guardarHucha()" class="w-full bg-purple-600 text-white py-2 rounded-lg font-black text-[10px]">CREAR HUCHA</button>
        </div>
        <div id="lista-huchas"></div>
    </div>

    <div id="config" class="tab-content p-4 max-w-2xl mx-auto">
        <div class="card bg-blue-50/50">
            <h3 class="text-[10px] font-black text-blue-600 uppercase mb-3">Añadir Presupuesto</h3>
            <div class="grid grid-cols-2 gap-2 mb-2">
                <input type="text" id="cfg-cat" placeholder="CATEGORÍA">
                <input type="text" id="cfg-con" placeholder="CONCEPTO">
            </div>
            <div class="flex gap-2">
                <input type="number" id="cfg-imp" placeholder="€" style="width:80px">
                <select id="cfg-tipo"><option value="Gasto">Gasto</option><option value="Ingreso">Ingreso</option></select>
                <button onclick="guardarConfig()" class="bg-blue-600 text-white px-4 rounded-lg font-black text-[10px]">AÑADIR</button>
            </div>
        </div>
        <div id="lista-presupuestos" class="mt-4"></div>
        <button onclick="borrarTodo()" class="w-full mt-10 py-4 text-rose-500 text-[10px] font-black">BORRAR TODOS LOS DATOS</button>
    </div>

    <div id="graficos" class="tab-content p-4 max-w-2xl mx-auto">
        <div class="card h-[300px]"><canvas id="chartDonut"></canvas></div>
    </div>

    <script>
        const DB_KEY = 'FINANZAS_MASTER_V17_5';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || { movs: [], config: [], huchas: [] };
        let tipoMuro = 'Ingreso';
        let mesSeleccionado = new Date().toISOString().slice(0, 7);

        // --- CALCULADORA ---
        let calcVal = "0", calcOpPend = null, calcPrevVal = 0, calcNewNum = true;
        function abrirCalc() { document.getElementById('calc-modal').style.display = 'flex'; calcClear(); }
        function cerrarCalc() { document.getElementById('calc-modal').style.display = 'none'; }
        function calcIn(n) { if(calcNewNum){calcVal=n; calcNewNum=false;} else {calcVal+=n;} document.getElementById('calc-display').innerText=calcVal; }
        function calcOp(op) {
            const v = parseFloat(calcVal);
            if(calcOpPend && !calcNewNum) {
                if(calcOpPend==='+') calcPrevVal += v;
                if(calcOpPend==='-') calcPrevVal -= v;
                if(calcOpPend==='*') calcPrevVal *= v;
                if(calcOpPend==='/') calcPrevVal /= v;
                calcVal = String(calcPrevVal);
            } else { calcPrevVal = v; }
            calcOpPend = op; calcNewNum = true;
            document.getElementById('calc-display').innerText = calcVal;
        }
        function calcClear() { calcVal="0"; calcOpPend=null; calcPrevVal=0; calcNewNum=true; document.getElementById('calc-display').innerText="0"; }
        function calcOk() { if(calcOpPend) calcOp('='); document.getElementById('in-valor').value = parseFloat(calcVal).toFixed(2); cerrarCalc(); }

        // --- LÓGICA CORE ---
        function save() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
        function showTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(t).classList.add('active');
            if(t==='huchas') renderHuchas();
            if(t==='config') renderPresupuestos();
            if(t==='graficos') renderGraficos();
        }
        function setTipoMuro(t) { tipoMuro = t; document.querySelectorAll('.btn-tipo').forEach(b => b.classList.remove('active')); document.getElementById('t-'+t).classList.add('active'); cargarConceptosMuro(); }
        function cargarConceptosMuro() {
            const cats = [...new Set(db.config.filter(c => c.tipo === tipoMuro).map(c => c.categoria))].sort();
            document.getElementById('in-cat').innerHTML = `<option value="">CATEGORÍA</option>` + cats.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('in-con').innerHTML = `<option value="">CONCEPTO</option>`;
        }
        document.getElementById('in-cat').onchange = () => {
            const cat = document.getElementById('in-cat').value;
            const cons = db.config.filter(c => c.categoria === cat && c.tipo === tipoMuro);
            document.getElementById('in-con').innerHTML = `<option value="">CONCEPTO</option>` + cons.map(c => `<option value="${c.concepto}">${c.concepto}</option>`).join('');
        };

        function guardarRegistro() {
            const val = parseFloat(document.getElementById('in-valor').value);
            const cat = document.getElementById('in-cat').value;
            if(!val || !cat) return;
            db.movs.push({
                id: Date.now(),
                fecha: document.getElementById('in-fecha').value,
                tipo: tipoMuro,
                cat, 
                con: document.getElementById('in-con').value || "Varios",
                valor: val,
                fijo: document.getElementById('in-fijo').checked,
                extra: document.getElementById('in-extra').checked,
                nota: document.getElementById('in-nota').value.toUpperCase()
            });
            save(); actualizarUI();
            document.getElementById('in-valor').value = ""; document.getElementById('in-nota').value = "";
        }

        function actualizarUI() {
            const meses = [...new Set(db.movs.map(m => m.fecha.slice(0,7)))].sort().reverse();
            if(!meses.includes(mesSeleccionado)) meses.unshift(mesSeleccionado);
            document.getElementById('filtro-mes').innerHTML = meses.map(m => `<option value="${m}" ${m===mesSeleccionado?'selected':''}>${m}</option>`).join('');
            
            const movs = db.movs.filter(m => m.fecha.startsWith(mesSeleccionado)).sort((a,b) => b.id - a.id);
            let ing = 0, gas = 0, iF = 0, iV = 0, iE = 0;

            document.getElementById('lista-movs').innerHTML = movs.map(m => {
                if(m.tipo === 'Ingreso') {
                    ing += m.valor;
                    if(m.fijo) iF += m.valor; else if(m.extra) iE += m.valor; else iV += m.valor;
                } else {
                    gas += m.valor;
                }
                return `
                <div class="card p-3 flex justify-between items-center border-l-4 ${m.tipo==='Ingreso'?'border-emerald-500':'border-rose-500'}">
                    <div>
                        <p class="text-[9px] font-black text-slate-400 uppercase">${m.cat} | ${m.fecha.split('-')[2]}</p>
                        <p class="font-black text-xs text-slate-700">${m.con}</p>
                    </div>
                    <p class="font-black ${m.tipo==='Ingreso'?'text-emerald-600':'text-rose-600'}">${m.valor.toFixed(2)}€</p>
                </div>`;
            }).join('');

            document.getElementById('disp-real').innerText = (ing-gas).toFixed(2) + "€";
            document.getElementById('sum-ing-fijo').innerText = iF.toFixed(0) + "€";
            document.getElementById('sum-ing-var').innerText = iV.toFixed(0) + "€";
            document.getElementById('sum-ing-extra').innerText = iE.toFixed(0) + "€";
            const hTotal = db.huchas.reduce((a,b)=>a+b.ahorro, 0);
            document.getElementById('patrimonio-total').innerText = (ing-gas+hTotal).toFixed(2) + "€";
        }

        function cambiarMes(m) { mesSeleccionado = m; actualizarUI(); }

        // --- HUCHAS ---
        function renderHuchas() {
            document.getElementById('lista-huchas').innerHTML = db.huchas.map((h, i) => {
                const fal = h.meta - h.ahorro;
                const pct = Math.min((h.ahorro / h.meta) * 100, 100);
                return `
                <div class="card">
                    <div class="flex justify-between mb-2">
                        <span class="font-black text-xs uppercase">${h.nombre}</span>
                        <span class="font-black text-emerald-500">${h.ahorro}€ / ${h.meta}€</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-2">
                        <div class="bg-emerald-500 h-full" style="width:${pct}%"></div>
                    </div>
                    <p class="text-[9px] font-bold text-slate-400 mb-2 uppercase">${fal > 0 ? 'Faltan: '+fal+'€' : '¡META CONSEGUIDA!'}</p>
                    <div class="flex gap-2">
                        <input type="number" id="h-add-${i}" placeholder="€" class="!h-8 !text-xs">
                        <button onclick="addH(${i})" class="bg-emerald-500 text-white px-4 rounded-lg text-[10px] font-black">AÑADIR</button>
                        <button onclick="delH(${i})" class="text-rose-400"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            }).join('');
        }
        function guardarHucha() {
            const n = document.getElementById('hucha-nombre').value;
            const m = parseFloat(document.getElementById('hucha-meta').value);
            if(n && m) { db.huchas.push({nombre: n.toUpperCase(), meta: m, ahorro: 0}); save(); renderHuchas(); }
        }
        function addH(i) { const v = parseFloat(document.getElementById(`h-add-${i}`).value); if(v){db.huchas[i].ahorro+=v; save(); renderHuchas();} }
        function delH(i) { db.huchas.splice(i,1); save(); renderHuchas(); }

        // --- AJUSTES ---
        function guardarConfig() {
            const cat = document.getElementById('cfg-cat').value.toUpperCase();
            const con = document.getElementById('cfg-con').value.toUpperCase() || "GENERAL";
            const imp = parseFloat(document.getElementById('cfg-imp').value) || 0;
            const tipo = document.getElementById('cfg-tipo').value;
            if(cat) { db.config.push({id: Date.now(), categoria: cat, concepto: con, importe: imp, tipo}); save(); renderPresupuestos(); }
        }
        function renderPresupuestos() {
            const cats = [...new Set(db.config.map(c => c.categoria))].sort();
            document.getElementById('lista-presupuestos').innerHTML = cats.map(cat => {
                const items = db.config.filter(c => c.categoria === cat);
                return `
                <details class="bg-white border rounded-xl mb-2">
                    <summary class="p-3 font-black text-[10px] uppercase text-slate-700">${cat}</summary>
                    <div class="p-2 space-y-1">
                        ${items.map(it => `
                            <div class="flex justify-between bg-slate-50 p-2 rounded text-[9px] font-bold">
                                <span>${it.concepto} (${it.tipo})</span>
                                <span>${it.importe}€ <button onclick="delCfg(${it.id})" class="ml-2 text-rose-400"><i class="fas fa-times"></i></button></span>
                            </div>
                        `).join('')}
                    </div>
                </details>`;
            }).join('');
        }
        function delCfg(id) { db.config = db.config.filter(c => c.id !== id); save(); renderPresupuestos(); }

        function renderGraficos() {
            const gas = db.movs.filter(m => m.fecha.startsWith(mesSeleccionado) && m.tipo === 'Gasto');
            const cats = {}; gas.forEach(g => cats[g.cat] = (cats[g.cat]||0) + g.valor);
            new Chart(document.getElementById('chartDonut'), {
                type: 'doughnut',
                data: { labels: Object.keys(cats), datasets: [{ data: Object.values(cats), backgroundColor: ['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6'] }] }
            });
        }

        function borrarTodo() { if(confirm("¿BORRAR TODO?")) { localStorage.clear(); location.reload(); } }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); }
        
        window.onload = () => {
            document.getElementById('in-fecha').valueAsDate = new Date();
            actualizarUI();
            cargarConceptosMuro();
        };
    </script>
</body>
</html>
