    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding-bottom: 110px; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }

        html.dark body { background-color: #0f172a; color: #e2e8f0; }
        input, select { border: 1px solid #e2e8f0 !important; border-radius: 0.75rem; height: 44px; padding: 0 12px; width: 100%; outline: none; font-size: 14px !important; }
        html.dark input, html.dark select { background-color: #334155; border-color: #475569 !important; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-active { color: #3b82f6; border-top: 3px solid #3b82f6; font-weight: 900; background: rgba(59, 130, 246, 0.05); }

        /* CALCULATOR STYLES */

        .calc-btn-op { background: #e0e7ff; color: #4338ca; }
        .calc-btn-eq { background: #3b82f6; color: white; grid-column: span 2; }
        .calc-btn-clr { background: #fee2e2; color: #ef4444; }
        html.dark .calc-btn { background: #334155; color: white; }

    <div id="modal-calc" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-end sm:items-center justify-center p-4 backdrop-blur-sm">

            <div class="bg-slate-100 dark:bg-slate-700 p-3 rounded-xl mb-4 text-right">
                <div id="calc-screen" class="text-3xl font-black text-slate-800 dark:text-white tracking-widest truncate">0</div>
            </div>
            <div class="calc-grid">
                <button onclick="calcOp('C')" class="calc-btn calc-btn-clr">C</button>
                <button onclick="calcOp('/')" class="calc-btn calc-btn-op">÷</button>
                <button onclick="calcOp('*')" class="calc-btn calc-btn-op">×</button>
                
                <button onclick="calcAdd('7')" class="calc-btn">7</button>
                <button onclick="calcAdd('8')" class="calc-btn">8</button>
                <button onclick="calcAdd('9')" class="calc-btn">9</button>
                <button onclick="calcOp('-')" class="calc-btn calc-btn-op">-</button>
                
                <button onclick="calcAdd('4')" class="calc-btn">4</button>
                <button onclick="calcAdd('5')" class="calc-btn">5</button>
                <button onclick="calcAdd('6')" class="calc-btn">6</button>
                <button onclick="calcOp('+')" class="calc-btn calc-btn-op">+</button>
                
                <button onclick="calcAdd('1')" class="calc-btn">1</button>
                <button onclick="calcAdd('2')" class="calc-btn">2</button>
                <button onclick="calcAdd('3')" class="calc-btn">3</button>
                
                <button onclick="calcAdd('0')" class="calc-btn" style="grid-column: span 1;">0</button>
                <button onclick="calcAdd('.')" class="calc-btn">.</button>
                <button onclick="calcOk()" class="calc-btn calc-btn-eq"><i class="fas fa-check mr-2"></i>OK</button>
            </div>
            <button onclick="cerrarCalc()" class="w-full mt-4 py-2 text-xs font-bold text-slate-400 uppercase">Cancelar</button>
        </div>
    </div>

    <div id="modal-hucha" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">

    <script>
        Chart.register(ChartDataLabels);
        const DB_KEY = 'FINANZAS_MASTER_DB_V1'; 
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || { movs: [], config: [], huchas: [] };
        
        let migracion = false;
        db.movs.forEach(m => { if(!m.pago) { m.pago = "EFECTIVO"; migracion = true; } });
        if(migracion) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

        let tipoMuro = 'Ingreso';
        let fechaActual = new Date();
        let mesSeleccionado = fechaActual.toISOString().slice(0, 7);
        let anioActual = fechaActual.getFullYear().toString();
        let idEditandoMov = null;
        let idEditandoHucha = null;
        let idEditandoCfg = null;
        let charts = {};
        let movParaHucha = null;
        let calcVal = "";

        function save() { localStorage.setItem(DB_KEY, JSON.stringify(db)); actualizarUI(); renderHuchas(); renderPresupuestos(); }
        function notificar(msg) { const t=document.getElementById('toast-container'); document.getElementById('toast-text').innerText=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

        // --- CALCULADORA ---
        function abrirCalculadora() { 
            calcVal = ""; 
            document.getElementById('calc-screen').innerText = "0"; 
            document.getElementById('modal-calc').classList.remove('hidden'); 
        }
        function cerrarCalc() { document.getElementById('modal-calc').classList.add('hidden'); }
        function calcAdd(n) { calcVal += n; document.getElementById('calc-screen').innerText = calcVal; }
        function calcOp(op) { calcVal += " " + op + " "; document.getElementById('calc-screen').innerText = calcVal; }
        function calcOk() {
            try {
                // Evaluar de forma segura
                const res = eval(calcVal.replace(/×/g,'*').replace(/÷/g,'/'));
                if(!isNaN(res)) {
                    document.getElementById('in-valor').value = parseFloat(res).toFixed(2);
                    cerrarCalc();
                } else { document.getElementById('calc-screen').innerText = "Error"; }
            } catch(e) { document.getElementById('calc-screen').innerText = "Error"; }
        }

        // --- BACKUP ---
        function descargarBackupJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const node = document.createElement('a'); node.setAttribute("href", dataStr); node.setAttribute("download", "Backup_Finanzas_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(node); node.click(); node.remove(); notificar("Backup Descargado");
        }
        function cargarBackupJSON(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    db = JSON.parse(e.target.result);
                    if(!db.huchas) db.huchas = []; if(!db.config) db.config = [];
                    save(); notificar("Restaurado. Recargando..."); setTimeout(() => location.reload(), 1500);
                } catch (error) { notificar("Error archivo"); }
            }; reader.readAsText(file);
        }

        // --- MURO ---
        function setTipoMuro(t) { tipoMuro = t; document.querySelectorAll('.btn-tipo').forEach(b => b.classList.remove('active')); document.getElementById('t-'+t).classList.add('active'); actualizarSelectsMuro(); }
        function checkLogic(changed) {
            const f = document.getElementById('in-fijo'); const e = document.getElementById('in-extra');
            if(changed === 'fijo' && f.checked) e.checked = false;
            if(changed === 'extra' && e.checked) f.checked = false;
        }

        function actualizarSelectsMuro() {
            const cats = [...new Set(db.config.filter(c => c.tipo.includes(tipoMuro)).map(c => c.categoria))].sort();
            document.getElementById('in-cat').innerHTML = `<option value="">CATEGORÍA...</option>` + cats.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('in-con').innerHTML = `<option value="">CONCEPTO...</option>`;
            if(!idEditandoMov) document.getElementById('in-valor').value = "";
        }
        function cargarConceptosMuro() {
            const cat = document.getElementById('in-cat').value;
            const cons = db.config.filter(c => c.tipo.includes(tipoMuro) && c.categoria === cat).sort((a,b)=>a.concepto.localeCompare(b.concepto));
            document.getElementById('in-con').innerHTML = `<option value="">CONCEPTO...</option>` + cons.map(c => `<option value="${c.concepto}">${c.concepto}</option>`).join('');
        }

        function guardarRegistro() {
            const val = parseFloat(document.getElementById('in-valor').value);
            const con = document.getElementById('in-con').value;
            if(isNaN(val) || !con) return notificar("Faltan datos");
            
            const nuevo = {
                id: idEditandoMov || Date.now().toString(),
                fecha: document.getElementById('in-fecha').value,
                tipo: tipoMuro,
                cat: document.getElementById('in-cat').value,
                con: con,
                nota: document.getElementById('in-nota').value.trim(),
                valor: val,
                pago: document.getElementById('in-pago').value,
                fijo: document.getElementById('in-fijo').checked,
                extra: document.getElementById('in-extra').checked,
                huchaId: idEditandoMov ? (db.movs.find(m=>String(m.id)===String(idEditandoMov))?.huchaId || null) : null
            };

            if(idEditandoMov) {
                const idx = db.movs.findIndex(m => String(m.id) === String(idEditandoMov));
                if(idx !== -1) db.movs[idx] = nuevo;
                notificar("Actualizado");
            } else {
                db.movs.push(nuevo);
                notificar("Guardado");
            }
            cancelarEdicion();
            save();
        }

        function editarMov(id) {
            const m = db.movs.find(x => String(x.id) === String(id)); if(!m) return;
            idEditandoMov = id;
            document.getElementById('in-fecha').value = m.fecha;
            document.getElementById('in-valor').value = m.valor;
            setTipoMuro(m.tipo);
            document.getElementById('in-cat').value = m.cat;
            cargarConceptosMuro();
            document.getElementById('in-con').value = m.con;
            document.getElementById('in-nota').value = m.nota || "";
            document.getElementById('in-pago').value = m.pago || 'EFECTIVO';
            document.getElementById('in-fijo').checked = m.fijo;
            document.getElementById('in-extra').checked = m.extra;
            document.getElementById('btn-guardar').innerText = "ACTUALIZAR";
            document.getElementById('btn-guardar').className = "w-full bg-emerald-600 text-white py-3 rounded-xl font-black text-xs uppercase mt-4 shadow-lg";
            document.getElementById('btn-cancelar').classList.remove('hidden');
            document.getElementById('muro').scrollIntoView({behavior:'smooth'});
        }

        function cancelarEdicion() {
            idEditandoMov = null;
            document.getElementById('in-valor').value = "";
            document.getElementById('in-cat').value = "";
            document.getElementById('in-con').innerHTML = "";
            document.getElementById('in-nota').value = "";
            document.getElementById('in-fijo').checked = false;
            document.getElementById('in-extra').checked = false;
            document.getElementById('btn-guardar').innerText = "GUARDAR MOVIMIENTO";
            document.getElementById('btn-guardar').className = "w-full bg-slate-900 text-white py-3 rounded-xl font-black text-xs uppercase mt-4 shadow-lg";

        }

        function clonarFijos() {
            if(mesSeleccionado.startsWith('AÑO')) return notificar("No en Anual");
            const d = new Date(mesSeleccionado + "-01"); d.setMonth(d.getMonth() - 1);
            const mesPasado = d.toISOString().slice(0, 7);
            const prevs = db.movs.filter(m => m.fecha.startsWith(mesPasado) && m.fijo);
            if(!prevs.length) return notificar("Sin fijos mes anterior");
            const actuals = db.movs.filter(m => m.fecha.startsWith(mesSeleccionado) && m.fijo);
            let c = 0;
            prevs.forEach(m => {
                if(!actuals.some(a => a.cat === m.cat && a.con === m.con && Math.abs(a.valor - m.valor) < 0.1)) {
                    db.movs.push({...m, id: Date.now()+Math.random(), fecha: mesSeleccionado + "-01", nota: ""}); c++;
                }
            });
            c>0 ? (save(), notificar(`Clonados ${c}`)) : notificar("Nada nuevo");
        }

            const meses = [...new Set(db.movs.map(m => m.fecha.slice(0,7)))].sort().reverse();
            const hoy = new Date().toISOString().slice(0,7);
            if(!meses.includes(hoy)) meses.unshift(hoy);
            
            const sel = document.getElementById('filtro-mes');
            sel.innerHTML = `<option value="AÑO-${anioActual}" class="font-bold bg-yellow-100 text-yellow-800">AÑO ${anioActual}</option>` + meses.map(m => `<option value="${m}">${m}</option>`).join('');
            sel.value = mesSeleccionado;
            document.getElementById('mes-header').innerText = mesSeleccionado.startsWith('AÑO') ? "RESUMEN ANUAL" : mesSeleccionado;
            
            let movs = mesSeleccionado.startsWith('AÑO') ? db.movs.filter(m => m.fecha.startsWith(mesSeleccionado.split('-')[1])) : db.movs.filter(m => m.fecha.startsWith(mesSeleccionado));
            document.getElementById('btn-clonar').classList.toggle('hidden', mesSeleccionado.startsWith('AÑO'));

            const iTotal = movs.filter(m=>m.tipo==='Ingreso').reduce((s,m)=>s+m.valor,0);
            const gTotal = movs.filter(m=>m.tipo==='Gasto').reduce((s,m)=>s+m.valor,0);

            document.getElementById('disp-real').innerText = disp.toFixed(2) + "€";

            document.getElementById('mini-bal').innerText = disp.toFixed(0)+"€";
            
            const huchas = (db.huchas||[]).reduce((s,h)=>s+(h.ahorro||0),0);
            document.getElementById('patrimonio-total').innerText = (disp + huchas).toFixed(2) + "€";

            document.getElementById('lista-movs').innerHTML = movs.sort((a,b) => new Date(b.fecha)-new Date(a.fecha) || b.id-a.id).map(m => {
                return `<div class="card p-0 overflow-hidden border-l-4 ${m.tipo==='Ingreso'?'border-emerald-500':'border-rose-500'}">
                    <div class="p-3 flex justify-between items-start">
                        <div class="truncate flex-1 pr-2">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[9px] font-black text-slate-500 bg-slate-100 px-1.5 rounded uppercase">${m.cat}</span>
                                <span class="text-[10px] text-slate-500 font-bold">${m.fecha.slice(8,10)}/${m.fecha.slice(5,7)}</span>
                            </div>
                            <p class="font-black text-xs uppercase text-slate-700 leading-tight">${m.con}</p>
                            ${m.nota ? `<p class="text-[10px] text-slate-500 italic mt-0.5 truncate">${m.nota}</p>` : ''}
                            <div class="flex gap-2 mt-1.5 flex-wrap items-center">
                                ${m.fijo ? '<span class="px-1.5 bg-indigo-50 text-indigo-600 rounded text-[8px] font-black">FIJO</span>' : (m.extra ? '<span class="px-1.5 bg-orange-50 text-orange-600 rounded text-[8px] font-black">EXTRA</span>' : '')} 
                                ${m.huchaId?'<span class="px-1.5 bg-purple-100 text-purple-700 rounded text-[8px] font-black"><i class="fas fa-piggy-bank mr-1"></i>HUCHA</span>':''}
                                <span class="text-[8px] text-slate-400 font-bold uppercase ml-auto">${m.pago}</span>
                            </div>
                        </div>
                        <div class="text-right whitespace-nowrap"><span class="font-black text-lg block ${m.tipo==='Ingreso'?'text-emerald-600':'text-rose-600'}">${m.valor.toFixed(2)}€</span></div>
                    </div>
                    <div class="flex border-t border-slate-100 divide-x divide-slate-100"><button onclick="abrirModalHucha('${m.id}')" class="card-action-btn hover:text-purple-600"><i class="fas fa-piggy-bank"></i></button><button onclick="editarMov('${m.id}')" class="card-action-btn hover:text-blue-600"><i class="fas fa-pencil-alt"></i></button><button onclick="borrarMov('${m.id}')" class="card-action-btn hover:text-rose-600"><i class="fas fa-trash"></i></button></div>
                </div>`;
            }).join('');
            
            // Datos para gráficas (Simplificado para brevedad)
            const calc = (t,f,e) => movs.filter(m => m.tipo===t && m.fijo===f && m.extra===e).reduce((s,m)=>s+m.valor,0);
            renderCharts(calc('Ingreso',true,false), calc('Ingreso',false,true), calc('Ingreso',false,false), calc('Gasto',true,false), calc('Gasto',false,true), calc('Gasto',false,false), movs);
        }

        // --- HUCHAS ---
        function guardarHucha() {
            const n = document.getElementById('hucha-nombre').value.toUpperCase();
            const m = parseFloat(document.getElementById('hucha-meta').value);
            if(!n) return notificar("Falta nombre");
            if(idEditandoHucha) { const h = db.huchas.find(x=>x.id===idEditandoHucha); if(h){h.nombre=n; h.meta=m;} } 
            else { db.huchas.push({id:Date.now(), nombre:n, meta:m||0, ahorro:0}); }
            cancelarEditHucha(); save();
        }
        function editarHucha(id) {
            const h = db.huchas.find(x => x.id === id); if(!h) return;
            idEditandoHucha = id;
            document.getElementById('hucha-nombre').value = h.nombre;
            document.getElementById('hucha-meta').value = h.meta;
            document.getElementById('btn-save-hucha').innerText = "Actualizar";
            document.getElementById('btn-cancel-hucha').classList.remove('hidden');
        }

            document.getElementById('btn-save-hucha').innerText = "Crear"; document.getElementById('btn-cancel-hucha').classList.add('hidden');

        function renderHuchas() {
            document.getElementById('lista-huchas').innerHTML = (db.huchas || []).map(h => {
                const pct = h.meta > 0 ? (h.ahorro / h.meta) * 100 : 0;
                return `<div class="card p-3"><div class="flex justify-between items-center mb-2"><h4 class="font-black text-sm uppercase text-purple-800">${h.nombre}</h4><div class="flex gap-2"><button onclick="editarHucha(${h.id})" class="text-blue-400"><i class="fas fa-pencil-alt"></i></button><button onclick="borrarHucha(${h.id})" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash"></i></button></div></div><div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Disponible: <b class="text-purple-600 text-xs">${h.ahorro.toFixed(2)}€</b></span><span>Meta: ${h.meta > 0 ? h.meta + '€' : '∞'}</span></div>${h.meta > 0 ? `<div class="w-full h-2 bg-slate-100 rounded-full"><div class="h-full bg-purple-500 rounded-full" style="width:${Math.min(100,pct)}%"></div></div>` : ''}</div>`;
            }).join('');
        }
        function abrirModalHucha(mId) { movParaHucha = mId; const mov = db.movs.find(m => m.id == mId); const divList = document.getElementById('modal-hucha-list'); if(mov.huchaId) { const h = db.huchas.find(x => x.id == mov.huchaId); divList.innerHTML = `<p class="text-center font-bold text-purple-800 mb-2">Vinculado a: ${h?h.nombre:'?'}</p><button onclick="desvincularHucha()" class="w-full bg-red-100 text-red-600 p-2 rounded font-bold uppercase text-xs">Desvincular</button>`; } else { divList.innerHTML = db.huchas.map(h => `<button onclick="vinculaMovHucha(${h.id})" class="w-full p-2 bg-purple-50 mb-1 rounded text-left text-xs font-bold text-purple-700 flex justify-between"><span>${h.nombre}</span><span>${h.ahorro.toFixed(0)}€</span></button>`).join(''); } document.getElementById('modal-hucha').classList.remove('hidden'); }
        function cerrarModalHucha() { document.getElementById('modal-hucha').classList.add('hidden'); }
        function vinculaMovHucha(hId) { const m = db.movs.find(x => x.id == movParaHucha); const h = db.huchas.find(x => x.id == hId); if(m && h) { m.huchaId = hId; h.ahorro -= m.valor; save(); notificar("Vinculado"); } cerrarModalHucha(); }
        function desvincularHucha() { const m = db.movs.find(x => x.id == movParaHucha); if(m && m.huchaId) { const h = db.huchas.find(x => x.id == m.huchaId); if(h) h.ahorro += m.valor; m.huchaId = null; save(); notificar("Desvinculado"); } cerrarModalHucha(); }

        // --- PRESUPUESTOS (NUEVO AGRUPAMIENTO ACORDEÓN) ---
        function guardarConfig() {
            const t=document.getElementById('cfg-tipo').value; const c=document.getElementById('cfg-cat').value.toUpperCase(); 
            const co=document.getElementById('cfg-con').value.toUpperCase(); const i=parseFloat(document.getElementById('cfg-imp').value)||0;
            if(!c) return notificar("Falta categoría");
            if(idEditandoCfg) { const cfg = db.config.find(x => x.id === idEditandoCfg); if(cfg) { cfg.tipo=t; cfg.categoria=c; cfg.concepto=co; cfg.importe=i; } } 
            else { db.config.push({id:Date.now(), tipo:t, categoria:c, concepto:co, importe:i}); }
            cancelarEditCfg(); save();
        }
        function editarCfg(id) { const c = db.config.find(x => x.id === id); if(!c) return; idEditandoCfg = id; document.getElementById('cfg-tipo').value = c.tipo; document.getElementById('cfg-cat').value = c.categoria; document.getElementById('cfg-con').value = c.concepto; document.getElementById('cfg-imp').value = c.importe; document.getElementById('btn-save-cfg').innerText = "Actualizar"; document.getElementById('btn-cancel-cfg').classList.remove('hidden'); }
        function cancelarEditCfg() { idEditandoCfg = null; document.getElementById('cfg-cat').value = ""; document.getElementById('cfg-con').value = ""; document.getElementById('cfg-imp').value = ""; document.getElementById('btn-save-cfg').innerText = "Guardar"; document.getElementById('btn-cancel-cfg').classList.add('hidden'); }
        
        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            if(el.classList.contains('open')) { el.classList.remove('open'); icon.classList.remove('fa-chevron-up'); icon.classList.add('fa-chevron-down'); }
            else { el.classList.add('open'); icon.classList.remove('fa-chevron-down'); icon.classList.add('fa-chevron-up'); }
        }

        function renderPresupuestos() {
            const list = document.getElementById('lista-presupuestos');
            
            // Agrupar por Categoría (Solo Gastos se visualizan comúnmente en presupuesto, pero permitimos ambos)
            const grouped = {};
            // Filtrar movimientos del mes actual para cálculo REAL
            const movsMes = mesSeleccionado.startsWith('AÑO') 
                    ? db.movs.filter(m => m.fecha.startsWith(mesSeleccionado.split('-')[1])) 
                    : db.movs.filter(m => m.fecha.startsWith(mesSeleccionado));

            db.config.sort((a,b)=>a.categoria.localeCompare(b.categoria)).forEach(c => {
                if(!grouped[c.categoria]) grouped[c.categoria] = { items: [], totalPresu: 0, totalReal: 0, tipo: c.tipo };
                grouped[c.categoria].items.push(c);
                grouped[c.categoria].totalPresu += c.importe;
                
                // Calculo REAL de este concepto específico
                const gastoRealConcepto = movsMes
                    .filter(m => m.tipo === c.tipo && m.cat === c.categoria && (!c.concepto || m.con === c.concepto))
                    .reduce((s,m) => s + m.valor, 0);
                
                c.gastoReal = gastoRealConcepto; // Guardamos temporalmente para pintar el item
                grouped[c.categoria].totalReal += gastoRealConcepto;
            });

            if(Object.keys(grouped).length === 0) { list.innerHTML = '<p class="text-center text-xs text-slate-400">Sin presupuestos.</p>'; return; }

            let html = '';
            Object.keys(grouped).forEach((cat, index) => {
                const g = grouped[cat];
                const pct = g.totalPresu > 0 ? (g.totalReal / g.totalPresu) * 100 : 0;
                const colorBarra = pct > 100 ? 'bg-rose-500' : 'bg-emerald-500';
                const colorTexto = pct > 100 ? 'text-rose-600' : 'text-emerald-600';
                const accordionId = 'acc-' + index;

                html += `
                <div class="card p-0 overflow-hidden mb-2 border border-slate-200 shadow-sm">
                    <div onclick="toggleAccordion('${accordionId}')" class="p-3 bg-slate-50 cursor-pointer flex justify-between items-center">
                        <div class="flex-1">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-black uppercase text-slate-700">${cat}</span>
                                <i id="icon-${accordionId}" class="fas fa-chevron-down text-slate-400 text-xs"></i>
                            </div>
                            <div class="flex justify-between text-[10px] font-bold mb-1">
                                <span class="${colorTexto}">${g.totalReal.toFixed(0)}€</span>
                                <span class="text-slate-400">/ ${g.totalPresu.toFixed(0)}€</span>
                            </div>
                            <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
                                <div class="h-full ${colorBarra}" style="width:${Math.min(pct,100)}%"></div>
                            </div>
                        </div>
                    </div>
                    <div id="${accordionId}" class="accordion-content bg-white">
                        <div class="p-3 space-y-3 border-t border-slate-100">
                            ${g.items.map(c => {
                                const pctItem = c.importe > 0 ? (c.gastoReal / c.importe) * 100 : 0;
                                return `
                                <div class="flex items-center justify-between text-[10px]">
                                    <div class="flex-1">
                                        <div class="flex justify-between mb-0.5">
                                            <span class="font-bold text-slate-600 uppercase">${c.concepto || 'GENERAL'}</span>
                                            <span class="font-bold text-slate-400">${c.gastoReal.toFixed(0)} / ${c.importe}€</span>
                                        </div>
                                        <div class="w-full h-1 bg-slate-100 rounded-full"><div class="h-full ${pctItem>100?'bg-rose-400':'bg-blue-400'}" style="width:${Math.min(pctItem,100)}%"></div></div>
                                    </div>
                                    <div class="flex gap-2 ml-3">
                                        <button onclick="editarCfg(${c.id})" class="text-blue-400"><i class="fas fa-pencil-alt"></i></button>
                                        <button onclick="if(confirm('¿Borrar?')) { db.config=db.config.filter(x=>x.id!=${c.id}); save(); }" class="text-rose-300 hover:text-rose-500"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
        }

        function borrarTodo() { if(confirm("¿BORRAR TODO?")) { localStorage.clear(); location.reload(); } }
        function cambiarMes(m) { mesSeleccionado = m; actualizarUI(); renderPresupuestos(); }
        function borrarMov(id) { if(confirm("¿Borrar?")) { const m = db.movs.find(x => String(x.id) === String(id)); if(m && m.huchaId) { const h = db.huchas.find(x => x.id == m.huchaId); if(h) h.ahorro += m.valor; } db.movs = db.movs.filter(m => String(m.id) !== String(id)); save(); notificar("Eliminado"); } }
        function borrarHucha(id) { if(confirm("¿Borrar Hucha?")) { db.huchas = db.huchas.filter(h => h.id != id); save(); notificar("Eliminado"); } }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); }
        function showTab(t) { document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); document.getElementById(t).classList.add('active'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active')); document.getElementById('nav-'+t).classList.add('nav-active'); if(t==='graficos') { actualizarUI(); } if(t==='huchas') renderHuchas(); if(t==='config') renderPresupuestos(); }
        function renderCharts(iF, iE, iV, gF, gE, gV, movsData) { const ctx = document.getElementById('chartApilado'); if(ctx) { if(charts.apilado) charts.apilado.destroy(); charts.apilado = new Chart(ctx, { type:'bar', data:{ labels:['ING','GAS'], datasets:[ { label:'Fijo', data:[iF, gF], backgroundColor:'#3730a3', stack:'S0' }, { label:'Variable', data:[iV, gV], backgroundColor:'#10b981', stack:'S0' }, { label:'Extra', data:[iE, gE], backgroundColor:'#fb7185', stack:'S0', borderRadius:4 } ] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, datalabels:{ color:'#fff', font:{size:9, weight:'bold'}, formatter:(v)=>v>10?Math.round(v):'' } } } }); } renderDonut(movsData); renderTendencia(); }
        function renderDonut(movs) { const ctx = document.getElementById('chartDonut'); if(!ctx) return; const dataMap = {}; movs.filter(m=>m.tipo==='Gasto').forEach(m => dataMap[m.cat] = (dataMap[m.cat]||0)+m.valor); const labels = Object.keys(dataMap); const data = Object.values(dataMap); if(charts.donut) charts.donut.destroy(); charts.donut = new Chart(ctx, { type:'doughnut', data:{ labels, datasets:[{ data, backgroundColor:['#f43f5e','#3b82f6','#10b981','#f59e0b','#8b5cf6','#6366f1'], borderWidth:0 }] }, options:{ responsive:true, maintainAspectRatio:false, cutout:'65%', plugins:{ legend:{position:'bottom', labels:{boxWidth:10, font:{size:9}}}, datalabels:{display:false} } } }); }
        function renderTendencia() { const ctx = document.getElementById('chartTendencia'); if(!ctx) return; const labels = []; for(let i=5; i>=0; i--) { const d = new Date(); d.setMonth(d.getMonth()-i); labels.push(d.toISOString().slice(0,7)); } const dI = labels.map(m => db.movs.filter(x => x.fecha.startsWith(m) && x.tipo==='Ingreso').reduce((s,x)=>s+x.valor,0)); const dG = labels.map(m => db.movs.filter(x => x.fecha.startsWith(m) && x.tipo==='Gasto').reduce((s,x)=>s+x.valor,0)); if(charts.tendencia) charts.tendencia.destroy(); charts.tendencia = new Chart(ctx, { type:'line', data:{ labels, datasets:[{label:'Ing', data:dI, borderColor:'#10b981', tension:0.3}, {label:'Gas', data:dG, borderColor:'#f43f5e', tension:0.3}]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{datalabels:{display:false}}} }); }

        checkLogic('init');
        document.getElementById('in-fecha').valueAsDate = new Date();
        setTipoMuro('Ingreso');
        actualizarUI();
    </script>
</body>
</html>
